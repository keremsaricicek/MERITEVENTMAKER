<title>Merit Kurumsal Görünüm</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* One fixed template for every screen: top bar, title row (actions right), content, right panel.
   One type size family, sentence case, two button styles, neutral greys; colour only for table occupancy and status. */
:root{--bg:#F3F4F6;--sf:#FFFFFF;--sf2:#F7F8F9;--tx:#1B1F24;--tx2:#5A6370;--bd:#E1E4E8;--bd2:#C6CBD2;--pr:#22272E;--pt:#FFFFFF;--ok:#2E7D5B;--mid:#A86A12;--no:#B23B3B;--vip:#8A6A1F;--sel:#E9EEF4;--halo:#DCE3EA;
--f:"Segoe UI Variable","Segoe UI","SF Pro Text",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181C;--sf:#1C2025;--sf2:#22272E;--tx:#E8EAED;--tx2:#A3ABB5;--bd:#2E343C;--bd2:#434B56;--pr:#E8EAED;--pt:#15181C;--ok:#6CC094;--mid:#E0B15A;--no:#E58A8A;--vip:#D9C69C;--sel:#28303A;--halo:#343D49;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181C;--sf:#1C2025;--sf2:#22272E;--tx:#E8EAED;--tx2:#A3ABB5;--bd:#2E343C;--bd2:#434B56;--pr:#E8EAED;--pt:#15181C;--ok:#6CC094;--mid:#E0B15A;--no:#E58A8A;--vip:#D9C69C;--sel:#28303A;--halo:#343D49;color-scheme:dark}
body{background:var(--bg);color:var(--tx);font:13px/1.45 var(--f)}
.wrap{max-width:1280px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pagehead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.pagehead h1{font:600 15px var(--f);margin:0 8px 0 0}
.note{color:var(--tx2);margin:8px 0 0;max-width:90ch}
button{font-family:var(--f);cursor:pointer}
.btn{height:30px;padding:0 12px;border-radius:4px;border:1px solid var(--bd2);background:var(--sf);color:var(--tx);font:600 13px var(--f);white-space:nowrap}
.btn.p{background:var(--pr);border-color:var(--pr);color:var(--pt)}
.btn[aria-pressed="true"]{background:var(--sel);border-color:var(--tx2)}
.btn.ic{width:30px;padding:0;display:inline-grid;place-items:center}
.lnk{background:none;border:0;padding:0;color:var(--tx);font:13px var(--f);text-decoration:underline;text-underline-offset:2px;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--tx);outline-offset:1px}
input.in,textarea{border:1px solid var(--bd2);border-radius:4px;background:var(--sf);color:var(--tx);font:13px var(--f);padding:0 8px;box-sizing:border-box}
input.in{height:30px}
.stagebox{width:100%;overflow:hidden;border:1px solid var(--bd2);border-radius:4px;background:var(--bg)}
.stage{width:1280px;height:760px;transform-origin:0 0;position:relative;background:var(--bg)}
/* template */
.top{height:40px;display:flex;align-items:center;padding:0 16px;gap:16px;border-bottom:1px solid var(--bd);background:var(--sf)}
.top .brand{font-weight:600}
.top nav{display:flex;align-self:stretch}
.top nav button{padding:0 10px;background:none;border:0;border-bottom:2px solid transparent;border-top:2px solid transparent;color:var(--tx2);font:13px var(--f)}
.top nav button.on{color:var(--tx);font-weight:600;border-bottom-color:var(--tx)}
.sp{flex:1}.top .ev{color:var(--tx2)}
.seg{display:flex}.seg .btn:first-child{border-radius:4px 0 0 4px}.seg .btn:last-child{border-radius:0 4px 4px 0;margin-left:-1px}

.strip{height:2px;background:linear-gradient(90deg,#2f6f66,#6fae9f,#d9a441,#c2703d,#d9a441,#6fae9f,#2f6f66);background-size:300% 100%;animation:flow 2.6s ease-in-out infinite alternate}
#gstrip{position:absolute;left:0;right:0;top:88px;z-index:3}
@keyframes flow{from{background-position:0 0}to{background-position:100% 0}}
.cols{position:absolute;inset:88px 0 0 0;display:flex}
.main{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel{width:320px;flex:none;border-left:1px solid var(--bd);background:var(--sf);overflow:auto}
.panel h3,.list h3{font:600 13px var(--f);margin:0;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--sf2)}
.pb{padding:2px 14px 12px}
.pb p{margin:8px 0 0}.mut{color:var(--tx2)}
.item{padding:10px 0;border-bottom:1px solid var(--bd)}
.item .src{font-size:12px;color:var(--tx2)}.item b{display:block;font-weight:600}.item p{margin:2px 0 0;color:var(--tx2)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.done{padding:8px 0;border-bottom:1px solid var(--bd);color:var(--tx2);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 8px;margin-top:8px}.kv span{color:var(--tx2)}
.list{width:300px;flex:none;border-right:1px solid var(--bd);background:var(--sf);overflow:auto}
.row{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 14px;border-bottom:1px solid var(--bd)}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--bd2)}
.dot.ok{background:var(--ok)}.dot.mid{background:var(--mid)}.dot.no{background:var(--no)}
.vip{color:var(--vip);font-size:12px;font-weight:600;border:1px solid var(--vip);border-radius:3px;padding:0 4px;margin-left:6px}
/* plan */
.plan{flex:1;min-height:0;background:var(--sf);border:1px solid var(--bd);border-radius:4px;display:flex;flex-direction:column}
.room{flex:1;min-height:0;width:100%}
.lg{height:32px;flex:none;border-top:1px solid var(--bd);display:flex;gap:18px;align-items:center;padding:0 12px;color:var(--tx2);font-size:12px}
.fx{fill:var(--sf2);stroke:var(--bd2)}line.fx{stroke:var(--tx2);stroke-width:2}
.fd{fill:none;stroke:var(--bd2);stroke-dasharray:4 4}
.fl{font:11px var(--f);fill:var(--tx2);text-anchor:middle;dominant-baseline:central}
.z{fill:var(--halo);fill-opacity:.5;stroke:var(--bd2)}.zl{font:600 10px var(--f);fill:var(--tx2)}
.t .b{fill:var(--sf)}.t .tr{fill:none;stroke:var(--bd2);stroke-width:3}
.t .ar{fill:none;stroke-width:3}.ar.ok{stroke:var(--ok)}.ar.mid{stroke:var(--mid)}.ar.no{stroke:var(--no)}
.t .n{font:600 11px var(--f);fill:var(--tx);text-anchor:middle}.t .o{font:10px var(--f);fill:var(--tx2);text-anchor:middle}
.t .ch{opacity:0;transition:opacity .15s}.t:hover .ch,.t.glow .ch{opacity:1}.ch circle{fill:var(--sf);stroke:var(--tx2);stroke-width:1}.ch circle.me{fill:#FF1744;stroke:#FF1744;filter:drop-shadow(0 0 3px #FF1744)}
.t .h{fill:var(--halo);opacity:0}.t.hot .h,.t.glow .h{opacity:1}
.t.ghost .h{opacity:1;fill:none;stroke:var(--tx);stroke-width:1.2;stroke-dasharray:4 3}
.t.q .tr{stroke:var(--mid);stroke-dasharray:3 3}.t.un .tr{stroke:var(--mid);stroke-dasharray:3 3}
.raw .t,.raw .fx,.raw .fl,.raw .fd{opacity:.3}.raw .t.found{opacity:1;transition:opacity .25s}
/* grid */
.tools{display:flex;gap:6px;align-items:center}
.grid{flex:1;min-height:0;overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:4px}
.grid table{width:100%;border-collapse:collapse}
.grid th{position:sticky;top:0;background:var(--sf2);font:600 12px var(--f);color:var(--tx2);text-align:left;padding:0 12px;height:32px;border-bottom:1px solid var(--bd)}
.grid td{padding:0 12px;height:36px;border-bottom:1px solid var(--bd);white-space:nowrap}
.grid tr[data-a]{cursor:pointer}.grid tr.on td{background:var(--sel)}
.grid .num{text-align:right;font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.cmp div{border:1px solid var(--bd);border-radius:4px;padding:6px 8px}

.chat{position:absolute;right:12px;bottom:12px;width:320px;height:410px;background:var(--sf);border:1px solid var(--bd2);border-radius:4px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.14);z-index:4}

.chat header b{font-weight:600;flex:1}
.msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.me{align-self:flex-end;background:var(--sel);border-radius:6px;padding:6px 10px;max-width:85%}.me small{display:block;color:var(--tx2);font-size:12px}
.mi{align-self:flex-start;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;max-width:94%}
.mi .src{font-size:12px;color:var(--tx2)}.mi p{margin:2px 0 0;color:var(--tx2)}.mi ul{margin:4px 0 0;padding-left:16px}.mi .done{border:0;padding:6px 0 0}
.qs{padding:6px 10px;border-top:1px solid var(--bd);display:grid;gap:2px;color:var(--tx2);font-size:12px}
.inp{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--bd);align-items:center}
.inp .in{flex:1;min-width:0}
.lis{flex:1;display:flex;align-items:center;gap:8px;color:var(--tx2);height:30px}
.bars{display:flex;gap:3px;align-items:center;height:18px}.bars i{width:3px;border-radius:1px;background:var(--tx);height:6px;animation:bar .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes bar{0%,100%{height:5px}50%{height:18px}}
@media (prefers-reduced-motion:reduce){.strip,.bars i{animation:none}.bars i{height:12px}}
.fb{margin-top:12px;display:grid;gap:8px;max-width:720px}
.fb .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.fb textarea{width:100%;min-height:64px;padding:6px 8px;resize:vertical}

/* v3 (owner notes 2026-11-11): modern rounded filled buttons, real UI font, neon occupancy, tinted Mimar window, settings page */
:root{--sec:#E9ECEF;--tint:#F1F2F4;--nok:#0FBF83;--nmid:#F5A300;--nno:#FF2D55;--f:"Inter","Segoe UI",system-ui,sans-serif}

body,.stage{font-size:14px}
.btn{height:34px;padding:0 14px;border-radius:8px;border:0;background:var(--sec)}

.top .brand{font-size:15px}.top nav button{font-size:14px}
.head{height:56px}.head h2{font-size:16px}.head .st{font-size:13px}
#gstrip{top:96px}.cols{inset:96px 0 0 0}
.item{border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0 0}
.item .src{display:inline-block;font-size:12px;color:var(--tx);background:var(--sec);border-radius:10px;padding:1px 8px;margin-bottom:6px}
.item .acts{justify-content:flex-end}.done{color:var(--tx)}
.panel h3,.list h3{font-size:14px;background:none;padding:14px 14px 4px;border:0}
.t .tr,.t .ar{stroke-width:3.5}.t .n{font-size:11.5px}
.ar.ok{stroke:var(--nok);filter:drop-shadow(0 0 2.5px var(--nok))}.ar.mid{stroke:var(--nmid);filter:drop-shadow(0 0 2.5px var(--nmid))}.ar.no{stroke:var(--nno);filter:drop-shadow(0 0 2.5px var(--nno))}
.dot.ok{background:var(--nok)}.dot.mid{background:var(--nmid)}.dot.no{background:var(--nno)}
.vipm{margin-left:6px;color:var(--pr)}
.chat{background:var(--tint);border-color:var(--pr);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.chat header{background:var(--tint)}
.mi{background:var(--sf);border-radius:14px 14px 14px 4px}
.me{background:var(--pr);color:var(--pt);border-radius:14px 14px 4px 14px}.me small{color:inherit;opacity:.8}
.grid,.plan{border-radius:10px}.grid td{height:40px}.grid th{font-size:13px}
.set{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:18px;display:grid;gap:18px;max-width:600px;align-self:flex-start}
.set .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.set label{width:120px;font-weight:600}
.mini{height:230px;border-bottom:1px solid var(--bd);display:flex}
.split{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}.split.side{flex-direction:row}
.split .plan{flex:1}.split .grid{flex:none;height:206px}.split.side .grid{flex:1;height:auto}.lnk{white-space:nowrap}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>String(s).toLocaleLowerCase('tr').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const B=(label,a,p)=>`<button class="btn${p?' p':''}" data-a="${a}">${label}</button>`;
const item=(src,title,text,acts,hot)=>`<div class="item"${hot?` data-hot="${hot}"`:''}><div class="src">Mimar önerisi · ${src}</div><b>${title}</b>${text?`<p>${text}</p>`:''}${acts?`<div class="acts">${acts}</div>`:''}</div>`;
const done=(txt,undo)=>`<div class="done"><span>${txt}</span>${undo?`<button class="lnk" data-a="${undo}">Geri al</button>`:''}</div>`;
const sec=(t,html)=>`<h3>${t}</h3><div class="pb">${html}</div>`;
const frame=o=>`<div class="head"><div><h2>Merit Royal Yılbaşı Galası</h2><span class="st">Grand Balo Salonu · 31 Aralık 2026</span></div><span class="sp"></span>${o.acts||''}</div><div class="cols">${o.left||''}<div class="main">${o.main}</div><aside class="panel">${o.panel}${o.st?sec('Özet','<p>'+o.st+'</p>'):''}</aside></div>${o.extra||''}`;
const SC={s1:['Plan analizi','"Analiz et"e basın. Sağdaki önerilerin üstüne gelince plandaki yeri işaretlenir; tek tek karar verin.'],
 s2:['Mimar','Fareyle bir masanın üstüne gelince sandalyeleri açılır. Hazır cümlelerden birine basın ya da yazın; mikrofon sesli komut örneğini çalıştırır. Örnek yalnızca birkaç cümleyi tanır.'],
 s3:['Misafirler','Sağdaki önerilere bakın; bir satıra tıklayınca o misafirin bilgisi ve geçmişi açılır.'],
 s4:['Oturma','"Taslak yerleşim öner"e basın; önerilen masalar kesik çizgiyle işaretlenir.'],
 s5:['Kapı','"Listede yok"a basın, sağdaki panelden "Yer öner" deyin.'],
 s6:['Ayarlar','Tema, açık / koyu ve yazı tipini seçin; bütün ekranlara uygulanır. Üç yazı tipini deneyip beğendiğinizi söyleyin.']};
const S={cur:'s1',s1:{phase:'up',num:null,cap:null,un:null,zones:false,zacc:false},s2:{open:true,msgs:[],think:false,listen:false,glow:null,mark:null,seated:false},s3:{dup:null,pax:null,sel:0},s4:{phase:'idle'},s5:{w:null,inn:{}}};
/* ---- plan ---- */
const T=[];(function(){const xs=[80,160,240,320,400,500,580,660,740,820],ys=[270,345,420,495];let n=1;
 ys.forEach((y,r)=>xs.forEach((x,c)=>{if(r>=2&&c===9)return;T.push({id:'T'+String(n).padStart(2,'0'),x,y,cap:10});n++}));
 [['VIP01',190,140],['VIP02',262,140],['VIP03',638,140],['VIP04',710,140]].forEach(v=>T.push({id:v[0],x:v[1],y:v[2],cap:12,v:1}))})();
const BASE={T08:8,T09:7,T25:9,T37:3,T38:0,VIP03:11,VIP04:7};
function tsvg(t,cls,lab,occ,me){const r=t.v?25:21,ch=Array.from({length:t.cap},(_,i)=>{const g=i*2*Math.PI/t.cap-Math.PI/2;return `<circle${i<(me||0)?' class="me"':''} cx="${((r+8)*Math.cos(g)).toFixed(1)}" cy="${((r+8)*Math.sin(g)).toFixed(1)}" r="3.2"/>`}).join(''),c=2*Math.PI*r,f=occ==null?0:occ/t.cap,col=f>=1?'no':f>=.8?'mid':'ok';
 return `<g class="t ${cls}" data-t="${t.id}" transform="translate(${t.x} ${t.y})"><circle class="h" r="${r+14}"/><g class="ch">${ch}</g><circle class="b" r="${r}"/><circle class="tr" r="${r}"/>${f>0?`<circle class="ar ${col}" r="${r}" stroke-dasharray="${(c*Math.min(f,1)).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90)"/>`:''}<text class="n" y="${occ==null?4:-1}">${lab}</text>${occ==null?'':`<text class="o" y="11">${occ}/${t.cap}</text>`}</g>`}
function zones(){return [['Sahne',330,6,310,74],['Dans pisti',340,84,220,116],['VIP',152,96,150,88],['VIP',600,96,150,88],['Bar',788,382,64,150],['Giriş',386,556,128,40]].map(z=>`<rect class="z" x="${z[1]}" y="${z[2]}" width="${z[3]}" height="${z[4]}" rx="3"/><text class="zl" x="${z[1]+5}" y="${z[2]+11}">${z[0]}</text>`).join('')}
function room(o){o=o||{};const c=o.cls||(()=>''),oc=o.occ||(()=>null);let s=`<svg class="room ${o.raw?'raw':''}" viewBox="0 0 900 604" role="img" aria-label="Salon planı">`;
 if(o.zones)s+=zones();
 s+='<rect class="fx" x="340" y="20" width="220" height="50" rx="2"/><text class="fl" x="450" y="45">Sahne</text><rect class="fx" x="574" y="28" width="52" height="34" rx="2"/><text class="fl" x="600" y="45">DJ</text><rect class="fd" x="350" y="98" width="200" height="92" rx="2"/><text class="fl" x="450" y="144">Dans pisti</text><rect class="fx" x="800" y="392" width="40" height="130" rx="2"/><text class="fl" x="820" y="457" transform="rotate(-90 820 457)">Bar</text><line class="fx" x1="400" y1="574" x2="500" y2="574"/><text class="fl" x="450" y="587">Ana giriş</text>';
 T.forEach(t=>{s+=tsvg(t,c(t),o.lab?o.lab(t):t.id,oc(t),o.me&&o.me.id===t.id?o.me.n:0)});
 if(o.un&&o.un!=='none')s+=`<g class="t ${o.un==='table'?'':'un'}" data-t="UN" transform="translate(570 548)"><circle class="h" r="26"/><circle class="b" r="16"/><circle class="tr" r="16"/>${o.un==='table'?'<text class="n" y="4">T39</text>':''}</g>`;
 return s+'</svg>'}

document.addEventListener('mouseover',e=>hot(e,true));document.addEventListener('mouseout',e=>hot(e,false));document.addEventListener('focusin',e=>hot(e,true));document.addEventListener('focusout',e=>hot(e,false));
function fit(){const b=$('#stagebox'),s=Math.min(1,b.clientWidth/1280);$('#stage').style.transform='scale('+s+')';b.style.height=Math.round(760*s)+'px'}
addEventListener('resize',fit);
const FB={};let db=null,tm=null;
try{Object.assign(FB,JSON.parse(localStorage.getItem('merit-kurumsal-gorus')||'{}'))}catch(e){}
async function persist(id){try{localStorage.setItem('merit-kurumsal-gorus',JSON.stringify(FB))}catch(e){}const f=FB[id]||{},sv=$('#save');
 if(!db){sv.textContent='Bu cihazda kaydedildi';return}sv.textContent='Kaydediliyor…';
 try{await db.doc('gorus2/'+id).set({v:f.v||null,note:f.note||'',at:Date.now()});sv.textContent='Kaydedildi'}catch(e){sv.textContent='Kaydedilemedi, tekrar deneyin'}}
$('#note').addEventListener('input',e=>{const id=S.cur,f=FB[id]||(FB[id]={});f.note=e.target.value;$('#save').textContent='Yazılıyor…';clearTimeout(tm);tm=setTimeout(()=>persist(id),900)});
{const r=document.documentElement.dataset;if(!r.theme)r.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';r.skin='grafit';r.font='inter';applyFont()}
render();fit();
(async()=>{try{db=await window.claude?.use?.('db')}catch(e){db=null}if(!db)return;
 db.collection('gorus2').onSnapshot(snap=>{for(const d of snap.docs){const x=d.data()||{};if(d.id===S.cur&&document.activeElement===$('#note'))continue;FB[d.id]={v:x.v||null,note:x.note||''}}render()},()=>{})})();
</script>
