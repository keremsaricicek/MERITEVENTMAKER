<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merit — Etkinlik Defteri</title>
<style>
/* ------------------------------------------------------------------
   MAÎTRE D' — the event is a bound reservation book.
   Grammar: PENCIL = not yet decided (draft, suggestion, assistant proposal)
            INK    = decided. Accepting anything is "Mürekkeple".
   Layout:  verso (left page) · spine (the evening's course) · recto (right page)
   ------------------------------------------------------------------ */
:root{
  --paper:#FBFAF7;      /* page stock */
  --spine:#F3F1EC;      /* gutter */
  --ink:#1A1E27;        /* blue-black fountain ink   15.98:1 on paper */
  --ink2:#4A505C;       /* secondary text             7.76:1 */
  --ink3:#636977;       /* tertiary, captions         5.27:1 */
  --pencil:#5E626B;     /* graphite: undecided        5.86:1 */
  --rule:#D8D5CD;       /* hairline */
  --rule2:#BDB9AF;
  --wash:#EEF1F6;       /* selection wash (pen-blue, very faint) */
  --pen:#24427A;        /* pen blue: focus, selection 9.42:1 */
  --green:#2C5A47;      /* arrived                    7.56:1 */
  --bord:#7A2A33;       /* no-show, ribbon, warnings  9.12:1 */
  --gold:#7E6020;       /* VIP only                   5.62:1 */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Charter,Caladea,Georgia,serif;
  --sans:"Segoe UI","SF Pro Text",-apple-system,Inter,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.num{font-variant-numeric:tabular-nums lining-nums}
.serif{font-family:var(--serif)}
.sc{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.vip{color:var(--gold);font-size:12px;letter-spacing:.12em;font-weight:600}
a,.link{color:var(--pen);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font:inherit}
a:hover,.link:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- the book ---------- */
.book{height:100vh;display:grid;grid-template-rows:44px 1fr 54px}
.head{display:flex;align-items:center;gap:22px;padding:0 28px;border-bottom:1px solid var(--rule)}
.mark{font-family:var(--serif);letter-spacing:.32em;font-size:14px;font-weight:600;cursor:pointer;background:none;border:0;padding:0}
.head .crumb{font-size:13px;color:var(--ink2)}
.head .title{font-family:var(--serif);font-style:italic;font-size:15px;flex:1;text-align:center;color:var(--ink2)}
.head .clock{font-size:13px;color:var(--ink2)}
.spread{display:grid;grid-template-columns:var(--verso,600px) 112px 1fr;min-height:0;transition:grid-template-columns .55s var(--ease)}
.page{min-height:0;overflow:auto;position:relative}
.verso{padding:34px 44px 40px 48px}
.recto{padding:34px 48px 40px 44px}
.page>.inner{animation:turn .32s var(--ease)}
@keyframes turn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* spine: the course of the evening */
.spine{background:var(--spine);border-left:1px solid var(--rule);border-right:1px solid var(--rule);position:relative;display:flex;flex-direction:column;align-items:stretch;padding-top:26px}
.ribbon{position:absolute;left:12px;top:0;width:9px;background:var(--bord);clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 7px),0 100%);transition:height .55s var(--ease);height:0}
.mo{background:none;border:0;cursor:pointer;padding:10px 8px 12px 28px;text-align:left;display:block;color:var(--ink2)}
.mo .rn{font-family:var(--serif);font-size:13px;color:var(--ink3);display:block;line-height:1}
.mo .lb{font-size:14px;display:block;margin-top:3px;font-weight:500}
.mo .st{font-size:12px;color:var(--ink3);display:block;margin-top:1px}
.mo[aria-current="true"] .lb{color:var(--ink);font-weight:600}
.mo:hover .lb{color:var(--ink)}
.spine .newbtn{margin:0 14px 0 28px}
.spine .sp{flex:1}
.spine .ver{font-size:12px;color:var(--ink3);padding:0 8px 16px 28px}

/* foot: the pen line (assistant) */
.foot{border-top:1px solid var(--rule);display:flex;align-items:center;gap:14px;padding:0 28px;position:relative;background:var(--paper)}
.foot svg{flex:none}
.foot input{flex:1;border:0;background:transparent;font-family:var(--serif);font-style:italic;font-size:17px;padding:8px 0;outline:none}
.foot input::placeholder{color:var(--ink3)}
.kbd{font-size:12px;border:1px solid var(--rule2);border-radius:3px;padding:1px 6px;color:var(--ink2);background:var(--paper)}
.foot .folio{font-family:var(--serif);font-size:13px;color:var(--ink3)}

/* type */
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0}
.pageh{display:flex;align-items:baseline;gap:16px;margin-bottom:6px}
.pageh h2{font-size:30px;letter-spacing:-.005em}
.lede{font-family:var(--serif);font-size:18px;color:var(--ink2);margin:6px 0 22px;max-width:46ch}
hr.r{border:0;border-top:1px solid var(--rule);margin:18px 0}

/* buttons: few, plain */
.btn{height:36px;padding:0 16px;border:1px solid var(--ink);background:transparent;border-radius:2px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--spine)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.ink:hover{background:#2C3240}
.btn.quiet{border-color:var(--rule2);color:var(--ink2)}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.dots{width:32px;height:32px;border:0;background:none;cursor:pointer;border-radius:2px;color:var(--ink2);font-size:18px;line-height:1;letter-spacing:1px}
.dots:hover{background:var(--spine)}
.words{display:flex;gap:18px;font-size:14px}
.words button{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink2);border-bottom:1px solid transparent}
.words button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

/* lists set like a ledger: hairlines, no boxes */
.ledger{width:100%;border-collapse:collapse}
.ledger th{font-weight:500;text-align:left;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:0 10px 8px 0;border-bottom:1px solid var(--rule2)}
.ledger td{padding:11px 10px 11px 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
.ledger tr.pick{cursor:pointer}
.ledger tr.pick:hover td{background:#F6F5F1}
.ledger tr[aria-selected="true"] td{background:var(--wash)}
.gname{font-family:var(--serif);font-size:18px}
.party{font-size:13px;color:var(--ink3);margin-left:6px}
.letter{font-family:var(--serif);font-size:20px;color:var(--ink3);padding:14px 0 4px!important;border-bottom:1px solid var(--rule2)!important}

/* menu (secondary actions live here) */
.menu{position:fixed;z-index:40;background:var(--paper);border:1px solid var(--rule2);box-shadow:0 10px 30px rgba(26,30,39,.12);min-width:250px;padding:6px 0}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 16px;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--spine)}
.menu .danger{color:var(--bord)}
.menu hr{border:0;border-top:1px solid var(--rule);margin:6px 0}

/* slips: paper tucked into the book (dialogs, assistant) */
.veil{position:fixed;inset:44px 0 54px 0;background:rgba(251,250,247,.55);z-index:30}
.slip{position:fixed;z-index:31;background:var(--paper);border:1px solid var(--rule2);box-shadow:0 18px 50px rgba(26,30,39,.16)}
.slip .sh{display:flex;align-items:baseline;gap:14px;padding:22px 28px 0}
.slip .sh h3{font-size:24px;flex:1}
.slip .sb{padding:16px 28px 26px}
.close{background:none;border:0;cursor:pointer;font-size:14px;color:var(--ink2)}

/* pencil vs ink */
.pencil{color:var(--pencil);font-family:var(--serif);font-style:italic}
.note{font-family:var(--serif);font-style:italic;color:var(--bord);font-size:15px}

/* ---------- home ---------- */
.ev{display:grid;grid-template-columns:76px 1fr auto 36px;gap:0 18px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--rule)}
.ev .d{font-family:var(--serif);font-size:38px;line-height:1;text-align:right;display:block}
.ev .m{font-size:12px;letter-spacing:.14em;color:var(--ink3);text-align:right;display:block;margin-top:4px}
.ev .n{font-family:var(--serif);font-size:23px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.ev .n:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.ev .v{font-size:14px;color:var(--ink2);margin-top:2px}
.ev .s{font-size:14px;color:var(--ink2);text-align:right}
.ev.past .d,.ev.past .n{color:var(--ink2)}
.yr{font-family:var(--serif);font-size:15px;color:var(--ink3);margin:26px 0 0;letter-spacing:.06em}

/* ---------- overview ---------- */
.titlepage{max-width:560px}
.titlepage h1{font-size:50px;line-height:1.05;letter-spacing:-.01em;margin:14px 0 14px}
.colophon{width:100%;border-collapse:collapse;margin-top:26px;max-width:470px}
.colophon td{padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px}
.colophon td:last-child{text-align:right;font-family:var(--serif);font-size:19px}
.verdict{font-size:40px;line-height:1.1;margin:10px 0 8px;max-width:16ch}
.issue{padding:18px 0 18px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:86px 1fr;gap:4px 16px}
.issue .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--bord);padding-top:5px}
.issue h3{font-size:20px}
.issue p{margin:3px 0 6px;color:var(--ink2);font-size:15px}
.check{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;font-size:15px}

/* ---------- plan drawing ---------- */
.plan{width:100%;height:auto;display:block;user-select:none}
.plan text{font-family:var(--serif)}
.tbl{cursor:pointer}
.tbl .top{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}
.tbl .ch{fill:var(--paper);stroke:var(--ink);stroke-width:.9}
.tbl .ch.on{fill:var(--ink)}
.tbl .ch.pen{fill:#CDCFD4;stroke:var(--pencil);stroke-dasharray:2 1.5}
.pname{font-style:italic;font-size:17px;fill:var(--pencil);text-anchor:middle}
.tbl .no{font-size:19px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.tbl.dim .ch,.tbl.dim .top{opacity:.35}.tbl.dim .no{fill:var(--ink3)}
.tbl.fit .top{stroke:var(--pen);stroke-width:2.2}
.tbl.sel .top{stroke:var(--pen);stroke-width:2.4}
.tbl.hl .top{fill:var(--ink)} .tbl.hl .no{fill:var(--paper)}
.tbl.vipt .top{stroke:var(--gold)}
.free{font-family:var(--sans)!important;font-size:17px;fill:var(--pen);text-anchor:middle}
.pen-ghost{fill:none;stroke:var(--pencil);stroke-width:1.3;stroke-dasharray:5 4}
.titleblock text{font-family:var(--sans)}

/* ---------- salon ---------- */
.toolrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.toolrow .sp{flex:1}
.sug{padding:16px 0;border-bottom:1px solid var(--rule)}
.sug .what{font-family:var(--serif);font-style:italic;color:var(--pencil);font-size:17px}
.sug p{margin:4px 0 10px;font-size:14px;color:var(--ink2)}
.sug .acts{display:flex;gap:10px;align-items:center;min-height:30px}
.sug.done .what{color:var(--ink);font-style:normal}
.prop{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:15px;align-items:center}
.prop dt{color:var(--ink3);font-size:13px}
.prop dd{margin:0}

/* ---------- seating ---------- */
.seatrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 10px 11px 12px;border-bottom:1px solid var(--rule);cursor:grab;border-left:2px solid transparent}
.seatrow:hover{background:#F6F5F1}
.seatrow[aria-selected="true"]{background:var(--wash);border-left-color:var(--pen)}
.seatrow .meta{font-size:13px;color:var(--ink3);grid-column:1}
.seatrow .res{grid-column:2;grid-row:1/3;align-self:center;font-size:14px;text-align:right;min-width:150px}
.seatrow.placed .gname{color:var(--ink2)}
.grp{display:flex;align-items:baseline;gap:10px;margin:22px 0 4px}
.grp h3{font-size:17px;flex:1}
.mode{display:inline-flex;border:1px solid var(--rule2);border-radius:2px}
.mode button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink2)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- door (the host stand) ---------- */
.stand{max-width:780px;margin:0 auto}
#planSvg{max-height:calc(100vh - 230px)}
.tally{font-family:var(--serif);font-size:20px;color:var(--ink2);margin-bottom:26px}
.tally b{font-weight:500;color:var(--ink);font-size:30px}
.search{position:relative;border-bottom:1.5px solid var(--ink);display:flex;align-items:center;gap:14px;padding-bottom:6px}
.search input{flex:1;border:0;background:transparent;font-family:var(--serif);font-size:38px;padding:4px 0;outline:none;letter-spacing:-.005em}
.search input::placeholder{color:var(--ink3)}
.hint{font-size:13px;color:var(--ink3);margin:8px 0 18px}
.door{display:grid;grid-template-columns:34px 1fr 252px;align-items:center;gap:0 12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.door[aria-selected="true"]{background:var(--wash);box-shadow:-12px 0 0 var(--wash),12px 0 0 var(--wash)}
.door .gname{font-size:24px}
.door .meta{font-size:14px;color:var(--ink2);margin-top:1px}
.door .act{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-height:38px}
.door .state{font-size:14px}
.door .ok{color:var(--green);font-weight:600}
.door .no{color:var(--bord);font-weight:600}
.tick path{stroke:var(--green);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:0}
.tick.draw path{animation:draw .45s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
.cross path{stroke:var(--bord);stroke-width:2;fill:none;stroke-linecap:round}
.gline{padding:12px 0;border-bottom:1px solid var(--rule)}
.gline .top{display:flex;align-items:baseline}
.gline .top .serif{font-size:18px;flex:1}
.gline .track{height:2px;background:var(--rule);margin-top:8px;position:relative}
.gline .track i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .4s var(--ease)}
.recent{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px;align-items:baseline}
.flip{display:inline-block;animation:flip .35s var(--ease)}
@keyframes flip{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- reports ---------- */
.rep{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:18px 14px 18px 16px;cursor:pointer;border-left:2px solid transparent}
.rep:hover{background:#F6F5F1}
.rep[aria-pressed="true"]{border-left-color:var(--ink);background:var(--wash)}
.rep .t{font-family:var(--serif);font-size:21px;display:block}
.rep .d{font-size:14px;color:var(--ink2);display:block;margin-top:2px}
.rep .f{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:block;margin-top:6px}
.sheet{background:#fff;border:1px solid var(--rule2);box-shadow:0 2px 0 var(--rule),0 14px 34px rgba(26,30,39,.08);padding:34px 38px;max-width:720px;min-height:520px}
.sheet h4{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 2px}
.sheet .small{font-size:12px;color:var(--ink3)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:16px;border-top:1px solid var(--ink)}
.cards div{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 10px;font-size:12px;line-height:1.5}
.cards div:nth-child(4n){border-right:0}
.cards b{font-family:var(--serif);font-size:15px;font-weight:600;display:block;margin-bottom:2px}
.az td{font-size:13px;padding:5px 8px 5px 0;border-bottom:1px solid var(--rule)}

/* ---------- guests folio ---------- */
.folio h1{font-size:42px;line-height:1.08;margin:8px 0 6px}
.folio dl{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;margin:24px 0;font-size:15px}
.folio dt{color:var(--ink3);font-size:13px;padding-top:2px}
.folio dd{margin:0}
.seg{display:inline-flex;gap:0;border:1px solid var(--rule2);border-radius:2px}
.seg button{border:0;background:none;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.placecard{border:1px solid var(--rule2);padding:14px 18px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;line-height:1.8;background:#fff;max-width:340px}
.az-index{position:absolute;right:14px;top:120px;display:flex;flex-direction:column;font-size:12px;color:var(--ink3);gap:1px}
.az-index button{background:none;border:0;cursor:pointer;color:var(--ink3);padding:1px 4px;font-size:12px}
.az-index button:hover{color:var(--ink)}

/* ---------- assistant slip ---------- */
.conv{max-height:calc(100vh - 330px);overflow:auto;padding-right:6px}
.q{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.q .who{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding-top:4px}
.q .said{font-family:var(--serif);font-style:italic;font-size:18px}
.q .ans{font-size:15px}
.q .ans ul{margin:6px 0 0;padding-left:18px}
.q .ans li{margin:3px 0}
.proposal{border-left:2px dashed var(--pencil);padding:6px 0 6px 14px;margin:10px 0 4px}
.proposal .pencil{font-size:18px}
.idx{columns:2;column-gap:36px;font-size:15px}
.idx button{display:flex;width:100%;background:none;border:0;padding:6px 0;cursor:pointer;text-align:left;border-bottom:1px solid var(--rule);break-inside:avoid}
.idx button span:first-child{flex:1}
.idx .pg{font-family:var(--serif);color:var(--ink3)}

.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;font-size:14px;z-index:50;display:flex;gap:16px;align-items:center}
.toast .link{color:#C9D6F0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1100px){.spread{grid-template-columns:1fr!important}.spine{display:none}.recto{border-top:1px solid var(--rule)}}
</style>
</head>
<body>
<div class="book" id="book">
  <header class="head">
    <button class="mark" id="markBtn" title="Etkinlik defterine dön">MERIT</button>
    <span class="crumb" id="crumb">Etkinlik defteri</span>
    <span class="title" id="runTitle"></span>
    <span class="clock num" id="clock">Perşembe, 31 Aralık · 21:47</span>
    <button class="link" id="idxBtn" style="font-size:13px">Dizin <span class="kbd">F10</span></button>
  </header>
  <main class="spread" id="spread">
    <section class="page verso" id="verso"></section>
    <nav class="spine" id="spine" aria-label="Akşamın seyri"></nav>
    <section class="page recto" id="recto"></section>
  </main>
  <footer class="foot">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 19 L6 12 L15 3 L19 7 L10 16 Z" fill="none" stroke="#1A1E27" stroke-width="1.2"/><path d="M3 19 L6 12 L10 16 Z" fill="#1A1E27"/><path d="M13 5 L17 9" stroke="#1A1E27" stroke-width="1"/></svg>
    <input id="pen" autocomplete="off" spellcheck="false" placeholder="Deftere yazın ya da sorun — “mehmet kayayı t12ye oturt”, “bugün ne eksik”" aria-label="Asistan">
    <span class="kbd">F8</span>
    <span class="folio" id="folio"></span>
  </footer>
</div>

<script>
/* =================== data =================== */
const EV = {name:"Merit Royal Yılbaşı Galası", date:"31 Aralık 2026, Perşembe", venue:"Merit Royal Hotel", hall:"Grand Balo Salonu"};
const TOT = {pax:420, arrived:312, noshow:9, unseated:14, records:182};
const GROUPS = [
  {id:"ks", name:"Kerem Sarıçiçek", pax:38, arr:31},
  {id:"ld", name:"Loyalty Desk", pax:24, arr:19},
  {id:"im", name:"International Marketing", pax:16, arr:9},
  {id:"", name:"Bağımsız misafirler", pax:342, arr:253},
];
// tables: id, kind, cap, x, y, rot
const T = [];
const leftX=[105,195,285], rightX=[915,1005,1095], rows=[170,260,350,440];
let n=1;

/* =================== plan drawing (architect's ink plan) =================== */
function chairPos(t){
  const out=[];
  if(t.kind==="round"){ for(let i=0;i<t.cap;i++){const a=(i/t.cap)*Math.PI*2-Math.PI/2; out.push([Math.cos(a)*31,Math.sin(a)*31,a*180/Math.PI+90]);} }
  else { const L=104,W=34; for(let i=0;i<5;i++){const x=-L/2+L/10+i*L/5; out.push([x,-W/2-9,0]); out.push([x,W/2+9,180]);} out.push([-L/2-9,0,-90]); out.push([L/2+9,0,90]); }
  return out;
}
function tableSVG(t,o){
  const cls=["tbl"]; if(t.vip) cls.push("vipt");
  if(o.mode==="salon" && S.selTable===t.id) cls.push("sel");
  if(o.fit){ if(o.fit.has(t.id)) cls.push("fit"); else cls.push("dim"); }
  if(o.hl && o.hl.includes(t.id)) cls.push("hl");
  const chairs = chairPos(t); const pen = o.pencilSeats&&o.pencilSeats[t.id]||0;
  let s = `<g class="${cls.join(" ")}" data-t="${t.id}" transform="translate(${t.x} ${t.y}) rotate(${t.rot})">`;
  chairs.forEach(([x,y,a],i)=>{ const on = (o.mode==="seat"||o.mode==="mini") && i<t.used; const pc = o.mode==="seat" && i>=t.used && i<t.used+pen;
    s+=`<rect class="ch ${on?"on":""} ${pc?"pen":""}" x="-4.5" y="-3.5" width="9" height="7" rx="1.5" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(0)})"/>`; });
  s += t.kind==="round" ? `<circle class="top" r="22"/>` : `<rect class="top" x="-52" y="-17" width="104" height="34"/>`;
  s += t.kind==="round" ? `<text class="no" transform="rotate(${-t.rot})">${t.id}</text>` : `<text class="no" fill="#7E6020" font-size="17">${t.id}</text>`;

function bindSalon(){
  const svg=$("#planSvg"); if(!svg) return;
  const pt = e => { const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  let drag=null;
  svg.addEventListener("pointerdown",e=>{
    const g=e.target.closest(".tbl"); if(!g) return; const t=tb(g.dataset.t);
    if(S.selTable!==t.id){ S.selTable=t.id; render(); return; }
    const p=pt(e); drag={t, rot:e.target.classList.contains("rot"), dx:p.x-t.x, dy:p.y-t.y, g}; svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove",e=>{ if(!drag) return; const p=pt(e), t=drag.t;
    if(drag.rot){ let a=Math.atan2(p.y-t.y,p.x-t.x)*180/Math.PI+90; t.rot=Math.round(a/15)*15; const rv=$("#rotVal"); if(rv) rv.textContent=((t.rot%360)+360)%360+"°"; }
    else { t.x=Math.round((p.x-drag.dx)/5)*5; t.y=Math.round((p.y-drag.dy)/5)*5; }
    drag.g.setAttribute("transform",`translate(${t.x} ${t.y}) rotate(${t.rot})`); if(t.kind==="round") drag.g.querySelector(".no").setAttribute("transform",`rotate(${-t.rot})`);
  });
  svg.addEventListener("pointerup",()=>{ drag=null; });
}

    ${L}
    <div class="sc" style="margin-top:30px">Kural notları</div>
    <div style="padding:10px 0;border-bottom:1px solid var(--rule)"><span class="note">Selin Ak ile Deniz Yurt ayrı tutulsun — ikisi de T12’de.</span><br><button class="link" style="font-size:14px" onclick="S.hlRule=1;render()">Salonda göster</button> <span class="faint" style="font-size:13px;margin-left:8px">uyarıdır, engellemez</span></div>

  const sel = S.seatSel!=null ? G[S.seatSel] : null;

  const r = `<div class="toolrow"><span class="sc">${sel&&!sel.table?`<span style="color:var(--pen)">${sel.name} için ${pax(sel)} boş yeri olan masalar</span>`:"Salon · doluluk"}</span><span class="sp"></span><span class="faint num" style="font-size:14px">${seatedPax()} / 428 yer dolu</span></div>

const pencilAt = id => G.filter(g=>g.pencil&&g.table===id).reduce((s,g)=>s+pax(g),0);
function pencilMap(){ const m={}; G.filter(g=>g.pencil).forEach(g=>m[g.table]=(m[g.table]||0)+pax(g));

  S.conv.forEach(c=>{ if(c.prop&&!c.prop.done) (m[c.prop.t]=m[c.prop.t]||[]).push(G[c.prop.g].name+"?"); }); return m; }
function pickSeat(id){ const g=G[id]; if(g.table) return; S.seatSel = S.seatSel===id?null:id; render(); }
function seatOn(id, tid){
  const g=G[id], t=tb(tid);
  if(free(t)-pencilAt(tid)<pax(g)){ toast(`${tid}’de ${free(t)-pencilAt(tid)} boş yer var; ${g.name} için ${pax(g)} gerekli.`); return; }
  g.table=tid; g.justSeated=true; g.pencil=S.seatDraft;

function unseat(id){ const g=G[id]; if(!g.pencil) tb(g.table).used-=pax(g); g.table=""; g.pencil=false; g.warn=""; render(); }
function inkDraft(){ G.filter(g=>g.pencil).forEach(g=>{g.pencil=false; tb(g.table).used+=pax(g);}); render(); }
function eraseDraft(){ G.filter(g=>g.pencil).forEach(g=>{g.pencil=false; g.table="";}); render(); }
function seatGroup(gid){

function bindSeat(){

/* =================== menus & slips =================== */
function closeAll(){ document.querySelectorAll(".menu,.slip,.veil").forEach(e=>e.remove()); }
function menu(anchor, items){
  closeAll(); const m=document.createElement("div"); m.className="menu"; m.setAttribute("role","menu");
  items.forEach(([l,f,c])=>{ if(l==="—"){m.append(document.createElement("hr"));return;} const b=document.createElement("button"); b.textContent=l; if(c)b.className=c; b.onclick=()=>{closeAll(); new Function(f)();}; m.append(b); });
  document.body.append(m); const r=anchor.getBoundingClientRect(); const w=m.offsetWidth, h=m.offsetHeight;
  m.style.left=Math.max(12,Math.min(r.right-w, innerWidth-w-12))+"px"; m.style.top=(r.bottom+h+8>innerHeight? r.top-h-4 : r.bottom+4)+"px";
  setTimeout(()=>document.addEventListener("click",function h(e){ if(!m.contains(e.target)){m.remove();document.removeEventListener("click",h);} }),0);
}
function slip(html, w, bottom){
  closeAll();
  if(!bottom){ const v=document.createElement("div"); v.className="veil"; v.onclick=closeAll; document.body.append(v); }
  const s=document.createElement("div"); s.className="slip"; s.style.width=w+"px";
  if(bottom){ s.style.bottom="54px"; s.style.left="28px"; s.style.borderBottom="0"; } else { s.style.top="110px"; s.style.left="calc(50% - "+(w/2)+"px)"; }
  s.innerHTML=html; document.body.append(s); return s;
}

/* =================== the pen: assistant (F8) & index (F10) =================== */
function answer(text){
  const f=fold(text); const out={q:text};
  const tm = f.match(/\b(vip)\s?0?(\d)|\bt\s?0?(\d{1,2})/);
  if(/eksik|hazir mi|ne kaldi|sorun/.test(f)){
    out.a=`Üç konu açık:<ul><li><b>${unseatedPax()} kişinin masası yok</b> — <button class="link" onclick="go('event','oturma')">Oturma</button></li><li>Selin Ak ile Deniz Yurt aynı masada (T12) — ayrı tutulsun notu var.</li><li>Üç plan önerisi kurşun kalemde — <button class="link" onclick="go('event','salon')">Salon</button></li></ul>`;
  } else if(tm && /oturt|yerlestir|koy|tasi/.test(f)){
    const tid = tm[1] ? "VIP0"+tm[2] : "T"+String(tm[3]).padStart(2,"0");
    const t=tb(tid);
    const before=f.slice(0,tm.index).replace(/\b(lutfen|bunu)\b/g,"").trim().split(" ").filter(Boolean);
    const toks=before.map((w,i)=> i===before.length-1 ? w.replace(/(yi|yu|yi|i|u|y)$/,"") : w).map(w=>w.slice(0,Math.max(3,Math.min(w.length,5))));
    const hits=G.filter(g=>{const ws=fold(g.name).split(" "); return toks.length && toks.every(p=>ws.some(w=>w.startsWith(p)));});
    if(!t) out.a=`${tid} diye bir masa yok. Masalar T01–T38 ve VIP01–VIP04.`;
    else if(!hits.length) out.a=`“${esc(before.join(" "))}” adıyla bir misafir bulamadım.`;
    else if(hits.length>1) out.a=`Birden fazla eşleşme var — hangisi?<ul>${hits.map(h=>`<li><button class="link" onclick="penAsk('${h.name} ${tid} oturt')">${h.name}</button> <span class="faint">${h.table||"masasız"}</span></li>`).join("")}</ul>`;
    else { const g=hits[0];
      if(g.table===tid) out.a=`${g.name}${g.extra?" +"+g.extra:""} zaten ${tid}’de oturuyor. Bir şey değiştirmedim.`;
      else if(free(t)<pax(g)) out.a=`${tid}’de ${free(t)} boş yer var; ${g.name} için ${pax(g)} gerekli. Yeterli yeri olan en yakın masa: <b>${T.find(x=>free(x)>=pax(g)&&!x.vip).id}</b>.`;
      else { out.a=`Önce göstereyim — henüz bir şey değişmedi:`; out.prop={g:g.id,t:tid,text:`${g.name}${g.extra?" +"+g.extra:""} → ${tid}${g.table?` <span class="faint" style="font-style:normal;font-family:var(--sans);font-size:14px">(şu an ${g.table})</span>`:""}`, after:`${free(t)-pax(g)?`${tid}’de ${free(t)-pax(g)} yer kalır.`:`${tid} tam dolar.`} Salonda kurşun kalemle gösterildi.${g.vip&&!t.vip?" Not: VIP misafir, VIP olmayan masa.":""}`}; }
    }
  } else if(/nerede|masasi|hangi masa/.test(f)){
    const toks=f.replace(/nerede|masasi|hangi masa|oturuyor|da|de/g,"").trim().split(" ").filter(w=>w.length>2).map(w=>w.slice(0,5));
    const hits=G.filter(g=>{const ws=fold(g.name).split(" "); return toks.length&&toks.every(p=>ws.some(w=>w.startsWith(p)));});
    out.a = hits.length ? hits.map(g=>`<b>${g.name}</b> — ${g.table?`masa ${g.table}`:"henüz masası yok"}, ${g.arr==="geldi"?"geldi ("+g.time+")":g.arr}.`).join("<br>") : "Bu adla misafir bulamadım.";
  } else {
    out.a=`Bunu anlayamadım. Şöyle yazabilirsiniz: <i class="serif">“ayşe demir nerede”</i>, <i class="serif">“burak şahini t22ye oturt”</i>, <i class="serif">“bugün ne eksik”</i>. Tüm konular için <button class="link" onclick="openIndex()">Dizin (F10)</button>.`;
  }
  return out;
}
function penAsk(text){ const a=answer(text); S.conv.push(a); if(a.prop && S.where==="event" && S.moment!=="oturma"){ S.moment="oturma"; } render(); openPen(); }
function convHTML(){
  return S.conv.map((c,i)=>`<div class="q"><span class="who">Siz</span><span class="said">${esc(c.q)}</span></div>
    <div class="q"><span class="who">Defter</span><div class="ans">${c.a}${c.prop?`<div class="proposal"><div class="pencil">${c.prop.text}</div><div class="faint" style="font-size:14px">${c.prop.after}</div>
      <div style="margin-top:10px;display:flex;gap:10px;align-items:center">${c.prop.done==="ink"?`<span style="color:var(--green)">Mürekkeplendi.</span> <button class="link" onclick="propUndo(${i})">Geri al</button>`:c.prop.done==="no"?`<span class="faint">Vazgeçildi.</span>`:`<button class="btn ink sm" onclick="propInk(${i})">Mürekkeple</button><button class="link" style="color:var(--ink2)" onclick="S.conv[${i}].prop.done='no';render();openPen()">Vazgeç</button>`}</div></div>`:""}</div></div>`).join("");
}
function openPen(){
  const s=slip(`<div class="sh"><h3>Defter</h3><span class="faint" style="font-size:13px">Türkçe yazın; bir şeyi değiştirmeden önce gösterir.</span><button class="close" onclick="closeAll()">Kapat <span class="kbd">Esc</span></button></div>
    <div class="sb"><div class="conv" id="conv" style="max-height:min(460px,calc(100vh - 260px))">${convHTML()||'<p class="pencil" style="font-size:18px">Sorun ya da isteyin — “bugün ne eksik”.</p>'}</div></div>`, Math.min(660, innerWidth-80), true);
  const c=$("#conv"); c.scrollTop=c.scrollHeight; $("#pen").focus();
}
function propInk(i){ const p=S.conv[i].prop, g=G[p.g]; const prev=g.table, wasD=S.seatDraft; S.seatDraft=false; p.done="ink";
  if(prev){ tb(prev).used-=pax(g); g.table=""; }
  seatOn(p.g,p.t); g.justSeated=false; S.seatDraft=wasD; p.done="ink"; p.prev=prev; openPen(); }
function propUndo(i){ const p=S.conv[i].prop, g=G[p.g]; tb(g.table).used-=pax(g); g.table=p.prev||""; if(p.prev) tb(p.prev).used+=pax(g); p.done=false; render(); openPen(); }
const TOPICS=[
 ["Ayrı tutma kuralı","IV","Bir misafir kaydından “Ayrı tutma kuralı ekle”. Kural uyarır, engellemez; notu Oturma sayfasında görünür."],
 ["Davet eden ve gruplar","III","Junket ve davet eden kişi misafir kaydında tutulur; kapıda varış gruplara göre sayılır."],
 ["Etkinlik oluşturma","Defter","Etkinlik defterinde “Yeni”. Boş başlar ya da geçmiş bir etkinliğin salon düzenini alır."],
 ["Gelmedi ve geri alma","V","Gelmedi, satırdaki ··· içindedir; Giriş’in yanında durmaz. Planlı yer silinmez. Her işaretin yanında Geri al vardır."],
 ["Giriş","V","Adı yazın, ↵ ile girin. Yalnızca o satır değişir; yukarıdaki sayı bir artar."],
 ["Grubu birlikte oturtma","IV","Grup başlığında “Grubu birlikte oturt”: grubun tamamını alan ilk masaya yerleştirir."],
 ["İçe aktarma — Excel ve yapıştırma","III","Misafir defterinde “İçe aktar…”. Önce önizleme görünür, sonra deftere eklenir."],
 ["Kurşun kalem ve mürekkep","Tümü","Kurşun kalem: henüz karar verilmedi (taslak, öneri, asistan teklifi). Mürekkep: karar verildi. “Mürekkeple” bir öneriyi uygular."],
 ["Masa taşıma ve döndürme","II","Salon’da masayı seçin, sürükleyin; üstteki tutamakla 15°’lik adımlarla çevirin."],
 ["Plandan okuma (PDF / görsel)","II","Salon’da “Plandan oku…”. Destekli algılama bulduklarını kurşun kalemle çizer."],
 ["Raporlar","VI","Masa planı (Excel), baskı, kapı listesi A–Z, junket raporu, etkinlik özeti."],
 ["Taslak oturma","IV","Oturma’da “Kurşun kalem”e geçin; yerleşimler taslak kalır, “Hepsini mürekkeple” ile kesinleşir."],
];
function openIndex(k){
  const s=slip(`<div class="sh"><h3>Dizin</h3><span class="faint" style="font-size:13px">Konu · sayfa</span><button class="close" onclick="closeAll()">Kapat</button></div><div class="sb">
    ${k!=null?`<div style="padding:4px 0 18px;border-bottom:1px solid var(--rule2);margin-bottom:12px"><div class="serif" style="font-size:22px">${TOPICS[k][0]}</div><p style="margin:6px 0 0">${TOPICS[k][2]}</p></div>`:""}
    <div class="idx">${TOPICS.map((t,i)=>`<button onclick="openIndex(${i})"><span>${t[0]}</span><span class="pg">${t[1]}</span></button>`).join("")}</div></div>`, 760);
}
$("#pen").addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.value.trim()){ penAsk(e.target.value.trim()); e.target.value=""; } });
$("#pen").addEventListener("focus",()=>{ if(!$(".slip")) openPen(); });
$("#idxBtn").onclick=()=>openIndex();
$("#markBtn").onclick=()=>go("home");
document.addEventListener("keydown",e=>{
  if(e.key==="F8"){e.preventDefault(); $("#pen").focus(); openPen();}
  if(e.key==="F10"){e.preventDefault(); openIndex();}
  if(e.key==="Escape"){closeAll(); document.activeElement.blur();}
});
setInterval(()=>{},60000);
render();
// deep links for screenshots: #kapi, #oturma ...
const h=location.hash.slice(1); if(h){ if(h==="home") go("home"); else go("event",h); }
</script>
