<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merit Kontrol Masası</title>
<style>
:root{
  --ink-0:#0D1015;   /* the desk itself: frame, stage */
  --ink-1:#141820;   /* the answer column */
  --ink-2:#1B2029;   /* raised / hover */
  --ink-3:#252B35;   /* pressed / stage block */
  --rule:#2A313B;
  --rule-2:#3B434F;
  --paper:#EDE7DB;   /* primary text */
  --paper-2:#BDB5A7; /* secondary text */
  --paper-3:#9A9387; /* tertiary text, still >= 4.5:1 */
  --bronze:#C99D6B;  /* the one accent: line, focus, leader */
  --bronze-2:#8C6A47;
  --bronze-ink:#18120B;
  --vip:#E4C886;     /* only for a genuine VIP */
  --ok:#93C4A1;      /* geldi */
  --no:#E59C8C;      /* gelmedi / blocking */
  --info:#A7B9CD;
  --sheet:#F1ECE2;   /* printed paper preview only */
  --sheet-ink:#22201C;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,"Bitstream Charter",Georgia,serif;
  --sans:"Segoe UI","SF Pro Text",-apple-system,Inter,system-ui,sans-serif;
  --mono:"SF Mono","Cascadia Mono","JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace;
  --col:470px;
  --t:150ms;
}
@media (min-width:1700px){:root{--col:540px}}
@media (prefers-reduced-motion:reduce){:root{--t:0ms}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink-0);color:var(--paper);font:15px/1.45 var(--sans);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:56px minmax(0,1fr) 64px;grid-template-columns:minmax(0,1fr) var(--col);
  height:100vh;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── pano: the top rail of the desk ─────────────────────────────── */
.pano{grid-column:1/-1;display:flex;align-items:center;gap:22px;padding:0 24px;border-bottom:1px solid var(--rule)}
.mark{font:500 15px/1 var(--serif);letter-spacing:.34em;color:var(--paper);padding-right:20px;border-right:1px solid var(--rule)}
.evbtn{white-space:nowrap;min-width:0;background:none;border:0;padding:6px 8px;margin-left:-8px;border-radius:3px;cursor:pointer;text-align:left;display:flex;align-items:baseline;gap:12px}
.evbtn:hover{background:var(--ink-2)}
.evbtn b{font:400 19px/1.1 var(--serif);letter-spacing:.01em}
.evbtn span{color:var(--paper-2);font-size:14px}
.lamp{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ok);letter-spacing:.06em;text-transform:uppercase}
.lamp::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(147,196,161,.14)}
.tally{margin-left:auto;display:flex;align-items:baseline;gap:26px}
.tally div{display:flex;align-items:baseline;gap:8px}
.tally small{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--paper-3)}
.tally output{white-space:nowrap;font:500 17px/1 var(--mono);display:inline-block;text-align:right;padding:3px 4px;border-radius:2px;transition:background-color 900ms}
.tally output.tick{background:rgba(201,157,107,.26);transition:none}
#t-arr{min-width:9ch}#t-wait{min-width:3.5ch}#t-no{min-width:3ch}#t-un{min-width:3ch}
.clock{font:400 17px/1 var(--mono);color:var(--paper-2);padding-left:22px;border-left:1px solid var(--rule)}

/* ── stage: the room, always the ground ─────────────────────────── */
.stage{grid-row:2;grid-column:1;position:relative;overflow:hidden;background:var(--ink-0)}
#room{position:absolute;inset:18px 28px 46px 28px}
#room svg{width:100%;height:100%;display:block}
.caption{position:absolute;left:28px;right:28px;bottom:0;height:42px;display:flex;align-items:center;gap:22px;
  border-top:1px solid var(--rule);font-size:14px;color:var(--paper-2)}
.caption .read{min-width:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption .read b{color:var(--paper);font-weight:600}
.legend{display:flex;gap:16px;color:var(--paper-3);font-size:13px;white-space:nowrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.last{width:330px;flex:none;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--paper-2)}
.last button{background:none;border:0;color:var(--bronze);cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}

/* room drawing */
.wall{fill:none;stroke:var(--rule-2);stroke-width:2}
.fixt rect{fill:var(--ink-3);stroke:var(--rule-2)}
.fixt text,.ftxt{fill:var(--paper-3);font:600 14px var(--sans);letter-spacing:.32em}
.tb{cursor:pointer;transition:opacity var(--t)}
.tb .body{fill:var(--ink-2);stroke:var(--paper-3);stroke-width:1.4;transition:stroke var(--t)}
.tb.vipt .body{stroke:var(--vip);stroke-opacity:.75}
.tb .tl{fill:var(--paper);font:600 15px var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tb .tl.q{fill:var(--bronze)}
.tb:hover .body,.tb.sel .body{stroke:var(--bronze);stroke-width:2.2}
.tb.fit .body{stroke:var(--bronze);stroke-width:2}
.tb.dim{opacity:.32}
.tb.grp .body{stroke-dasharray:3 3}
.ch{fill:none;stroke:var(--paper-3);stroke-width:1.2;opacity:.8;transition:fill var(--t),stroke var(--t)}
.ch.plan{fill:var(--paper-3);stroke:var(--paper-3);opacity:1}
.ch.mine{fill:var(--bronze);stroke:var(--bronze);opacity:1}
.ch.prev{fill:none;stroke:var(--bronze);stroke-dasharray:2 2;stroke-width:1.6;opacity:1}
.ch.draft{fill:none;stroke:var(--paper);stroke-dasharray:2 1.5;opacity:1}
.ch.in{fill:var(--ok);stroke:var(--ok);opacity:1}
.ch.part{fill:var(--ink-0);stroke:var(--ok);stroke-width:2;opacity:1}
.ch.no{fill:var(--ink-0);stroke:var(--no);stroke-width:1.6;opacity:1}
.ch.wait{fill:none;stroke:var(--paper-2);opacity:1}
.ch.lit{animation:lit 1.4s ease-out 1}
@keyframes lit{0%{stroke:var(--bronze);stroke-width:5}100%{stroke-width:1.2}}
@media (prefers-reduced-motion:reduce){.ch.lit{animation:none}}
.pin circle{fill:var(--ink-0);stroke:var(--bronze);stroke-width:1.6}
.pin.bad circle{stroke:var(--no)}
.pin text{fill:var(--paper);font:700 13px var(--sans);text-anchor:middle;dominant-baseline:central}
.ghost{fill:none;stroke:var(--bronze);stroke-dasharray:4 4;stroke-width:1.4}
.plan-edit .tb{cursor:grab}

/* ── answer column ──────────────────────────────────────────────── */
.col{grid-row:2;grid-column:2;border-left:1px solid var(--rule);background:var(--ink-1);display:flex;flex-direction:column;min-height:0}
.ch-h{padding:22px 26px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-end;gap:14px;flex:none}
.ch-h h1{margin:0;font:400 27px/1.1 var(--serif);letter-spacing:.005em}
.ch-h p{margin:5px 0 0;color:var(--paper-2);font-size:14px}
.ch-h .act{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.scroll{flex:1 1 auto;overflow:auto;min-height:0;padding:6px 0 18px;scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
.foot{flex:none;border-top:1px solid var(--rule);padding:16px 26px 18px;background:var(--ink-1)}
.eyebrow{margin:20px 26px 8px;font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--paper-3);display:flex;gap:10px;align-items:baseline}
.eyebrow span{letter-spacing:0;text-transform:none;font-weight:400}
.btn{height:34px;padding:0 14px;border-radius:3px;border:1px solid var(--rule-2);background:transparent;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--paper-3);background:var(--ink-2)}
.btn.pri{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink);font-weight:600}
.btn.pri:hover{background:#D6AB79}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.txt{background:none;border:0;padding:4px 2px;color:var(--paper-2);cursor:pointer;font-size:14px;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:4px}
.txt:hover{color:var(--paper);text-decoration-color:var(--bronze)}
.txt.danger{color:var(--no)}
.kbd{font:500 12px/1 var(--mono);color:var(--paper-2);border:1px solid var(--rule-2);border-radius:3px;padding:3px 5px}
.verdict{margin:22px 26px 6px;font:400 25px/1.3 var(--serif)}
.verdict em{font-style:normal;color:var(--bronze)}
.row{display:grid;align-items:center;gap:12px;padding:10px 26px;border-bottom:1px solid rgba(42,49,59,.7);cursor:pointer;position:relative}
.row:hover{background:var(--ink-2)}
.row.on{background:var(--ink-2);box-shadow:inset 3px 0 0 var(--bronze)}
.row .t1{font-size:15px;color:var(--paper)}
.row .t2{font-size:13.5px;color:var(--paper-2)}
.issue{grid-template-columns:24px 1fr auto}
.glyph{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--bronze);display:grid;place-items:center;font:700 12px var(--sans);color:var(--paper)}
.glyph.bad{border-color:var(--no)}
.glyph.none{border-style:dashed;border-color:var(--paper-3)}
.check{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:7px 26px;font-size:14px;color:var(--paper-2)}
.check svg{margin-top:3px}
.numline{margin:4px 26px 0;font-size:14px;color:var(--paper-2);display:flex;flex-wrap:wrap;gap:4px 18px}
.numline b{font:500 15px var(--mono);color:var(--paper)}
.spark{margin:6px 26px 0}
.spark text{fill:var(--paper-3);font:12px var(--sans)}
.vip{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--sans);letter-spacing:.08em;color:var(--vip)}
.st{font-size:13.5px;white-space:nowrap}
.st.in{color:var(--ok)}.st.no{color:var(--no)}.st.wait{color:var(--paper-3)}
.code{font:500 15px var(--mono);color:var(--paper)}
.muted{color:var(--paper-3)}
.filters{display:flex;flex-wrap:wrap;gap:4px 18px;padding:12px 26px 10px;border-bottom:1px solid var(--rule)}
.filters button{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--paper-2);font-size:14px;border-bottom:2px solid transparent}
.filters button b{font:500 13px var(--mono);color:var(--paper-3);margin-left:5px}
.filters button.on{color:var(--paper);border-bottom-color:var(--bronze)}
.roll{grid-template-columns:minmax(0,1fr) 112px 54px 58px;padding-top:9px;padding-bottom:9px}
.roll .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roll .plus{color:var(--paper-3);font-family:var(--mono);font-size:13.5px;margin-left:6px}
.roll .h{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;color:var(--paper-2)}
.rollhead{display:grid;grid-template-columns:minmax(0,1fr) 112px 54px 58px;gap:12px;padding:8px 26px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-3);border-bottom:1px solid var(--rule)}
.dl{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;font-size:14px;margin-top:12px}
.dl dt{color:var(--paper-3)}.dl dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;cursor:pointer;color:var(--paper-2);font-size:13.5px}
.seg button+button{border-left:1px solid var(--rule-2)}
.seg button.on{background:var(--ink-3);color:var(--paper)}
.note{font-size:13.5px;color:var(--paper-2);margin-top:6px}
.warn{font-size:13.5px;color:var(--no)}
.tray{grid-template-columns:minmax(0,1fr) auto}
.tray .stt{min-width:120px;text-align:right;font-size:13.5px}
.door{grid-template-columns:minmax(0,1fr) 70px 150px;min-height:70px;padding-top:12px;padding-bottom:12px}
.door .t1{font-size:18px;font-weight:500}
.door .tcode{font:500 21px var(--mono);text-align:center}
.door .tcode.none{font:500 13px var(--sans);color:var(--no)}
.door .state{display:flex;justify-content:flex-end;align-items:center;gap:6px;height:36px}
.door .state .in{color:var(--ok);font-size:14px;text-align:right;line-height:1.2}
.door .state .no{color:var(--no);font-size:14px;text-align:right;line-height:1.2}
.more{width:30px;height:34px;border:0;background:none;color:var(--paper-2);cursor:pointer;border-radius:3px;font-size:18px;line-height:1}
.more:hover{background:var(--ink-3);color:var(--paper)}
.stepper{display:flex;align-items:center;gap:6px;font:500 15px var(--mono)}
.stepper button{width:28px;height:28px;border:1px solid var(--rule-2);background:none;border-radius:3px;cursor:pointer}
.grp{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:4px 12px;padding:9px 26px;font-size:14px}
.grp .bar{grid-column:1/-1;height:3px;background:var(--rule);position:relative}
.grp .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bronze-2);transition:width 600ms}
.grp .n{text-align:right;font:500 14px var(--mono)}
.results{display:flex;flex-direction:column;min-height:100%}
.results>:first-child{margin-top:auto}
.kind{font:600 12px/1 var(--sans);letter-spacing:.12em;color:var(--bronze);text-transform:uppercase;margin-bottom:5px}
.prop{grid-template-columns:minmax(0,1fr) auto}
.prop .enter{visibility:hidden}
.row.on .enter{visibility:visible}
.qhead{padding:20px 26px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex:none}
.qhead b{font:400 21px var(--serif)}
.qhead span{font-size:13px;color:var(--paper-3)}
.empty{padding:26px;color:var(--paper-2)}
.help{padding:0 26px 14px;color:var(--paper-2);font-size:14px}
.field{display:grid;gap:6px;margin-top:12px}
.field label{font-size:13px;color:var(--paper-3)}
.field input,.field select,.field textarea{background:var(--ink-0);border:1px solid var(--rule-2);border-radius:3px;padding:8px 10px;font-size:14.5px}
.field textarea{min-height:96px;resize:vertical;font-family:var(--mono);font-size:13.5px}
.repo{grid-template-columns:minmax(0,1fr) auto}
.fmt{font:500 12px var(--mono);color:var(--paper-2);border:1px solid var(--rule-2);border-radius:2px;padding:3px 6px}

/* ── the lower desk: lens dial + the line ───────────────────────── */
.dial{grid-row:3;grid-column:1;display:flex;align-items:stretch;padding:0 14px;border-top:1px solid var(--rule)}
.dial button{background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:9px;padding:0 15px;color:var(--paper-2);font-size:15px;position:relative}
.dial button .kbd{border-color:transparent;color:var(--paper-3);padding:0}
.dial button:hover{color:var(--paper)}
.dial button.on{color:var(--paper)}
.dial button.on::before{content:"";position:absolute;left:12px;right:12px;top:-1px;height:2px;background:var(--bronze)}
.dial button.on .kbd{color:var(--bronze)}
.dial .sep{width:1px;background:var(--rule);margin:16px 6px}
.line{grid-row:3;grid-column:2;border-top:1px solid var(--rule);border-left:1px solid var(--rule);display:flex;align-items:center;gap:10px;padding:0 18px 0 22px;background:var(--ink-1)}
.line.focus{border-top-color:var(--bronze)}
.line .pr{font:400 24px/1 var(--serif);color:var(--bronze);margin-top:-3px}
.line input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px;color:var(--paper);caret-color:var(--bronze)}
.line input::placeholder{color:var(--paper-3)}

/* ── home: the season strip ─────────────────────────────────────── */
#season{position:absolute;inset:0 0 42px 0;display:none}
.axis{position:absolute;left:56px;right:56px;top:52%;height:1px;background:var(--rule-2)}
.month{position:absolute;top:calc(52% + 12px);font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--paper-3);transform:translateX(-50%)}
.mtick{position:absolute;top:calc(52% - 4px);width:1px;height:9px;background:var(--rule-2)}
.now{position:absolute;top:13%;bottom:13%;width:1px;background:var(--bronze-2)}
.now span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font:600 12px var(--sans);letter-spacing:.12em;color:var(--bronze);white-space:nowrap}
.ev{position:absolute;transform:translateX(-50%);background:none;border:0;cursor:pointer;text-align:center;padding:6px 8px;border-radius:3px;width:180px}
.ev:hover{background:rgba(27,32,41,.8)}
.ev .d{font:400 34px/1 var(--serif);color:var(--paper)}
.ev .m{font:600 12px var(--sans);letter-spacing:.12em;color:var(--paper-3);text-transform:uppercase;margin-top:3px}
.ev .n{font-size:14.5px;color:var(--paper);margin-top:8px;line-height:1.3}
.ev .v{font-size:13px;color:var(--paper-2)}
.ev.past .d,.ev.past .n{color:var(--paper-2)}
.ev.on{box-shadow:inset 0 -2px 0 var(--bronze);background:rgba(27,32,41,.9)}
.dot{position:absolute;top:52%;width:13px;height:13px;margin:-6px 0 0 -6px;border-radius:50%;border:1.5px solid var(--paper-2);background:var(--ink-0)}
.dot.past{border-color:var(--paper-3)}
.dot.live{border-color:var(--bronze);background:var(--bronze)}
.dot.new{border-style:dashed;border-color:var(--bronze)}
.stem{position:absolute;width:1px;background:var(--rule)}
.seasonhead{position:absolute;left:56px;top:28px;font:400 15px var(--serif);color:var(--paper-2)}
.seasonhead b{display:block;font:400 30px/1.15 var(--serif);color:var(--paper);margin-bottom:4px}

/* ── report preview: paper under the desk lamp ──────────────────── */
#paper{position:absolute;inset:26px 40px 70px 40px;display:none;overflow:auto}
.sheet{background:var(--sheet);color:var(--sheet-ink);margin:0 auto;max-width:1100px;padding:34px 40px;border-radius:2px;box-shadow:0 30px 80px rgba(0,0,0,.55);font-size:13px}
.sheet h2{margin:0 0 2px;font:400 22px var(--serif)}
.sheet .sub{color:#5B564D;font-size:13px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{border:1px solid #B9B1A3;padding:8px 10px}
.card b{display:block;font:700 13px var(--sans);border-bottom:1px solid #B9B1A3;padding-bottom:4px;margin-bottom:4px}
.card div{font-size:12px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:0;margin-top:18px;border-top:1px solid #B9B1A3}
.tabs span{padding:6px 14px;font:600 12px var(--sans);border:1px solid #B9B1A3;border-top:0;margin-right:-1px;color:#5B564D}
.tabs span:first-child{background:#fff;color:var(--sheet-ink)}
.az{columns:3;column-gap:28px;font-size:12.5px;line-height:1.75}
.az div{display:flex;justify-content:space-between;border-bottom:1px dotted #B9B1A3;break-inside:avoid}
.az h4{margin:8px 0 2px;font:700 13px var(--serif)}
.jr{width:100%;border-collapse:collapse;font-size:12.5px}
.jr th{text-align:left;font-weight:600;border-bottom:1.5px solid #22201C;padding:5px 6px}
.jr td{border-bottom:1px solid #D2CBBE;padding:5px 6px}
.jr tr.g td{font-weight:700;background:#E6E0D4}

/* ── popover menu ───────────────────────────────────────────────── */
.menu{position:fixed;z-index:20;min-width:230px;background:var(--ink-2);border:1px solid var(--rule-2);border-radius:3px;padding:5px 0;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 16px;cursor:pointer;font-size:14px}
.menu button:hover,.menu button:focus-visible{background:var(--ink-3);outline:none}
.menu button.danger{color:var(--no)}
.menu hr{border:0;border-top:1px solid var(--rule);margin:5px 0}
#leader{position:fixed;inset:0;pointer-events:none;z-index:10;width:100vw;height:100vh}
#leader path{fill:none;stroke:var(--bronze);stroke-width:1.2}
#leader circle{fill:var(--bronze)}
</style>
</head>
<body>
<header class="pano">
  <div class="mark">MERIT</div>
  <button class="evbtn" id="evbtn" title="Etkinlikler (0)"><b>Merit Royal Yılbaşı Galası</b><span>31 Aralık 2026 · Grand Balo Salonu</span></button>
  <span class="lamp">Canlı</span>
  <div class="tally" aria-live="polite">
    <div><small>Geldi</small><output id="t-arr"></output></div>
    <div><small>Bekleniyor</small><output id="t-wait"></output></div>
    <div><small>Gelmedi</small><output id="t-no"></output></div>
    <div><small>Oturmamış</small><output id="t-un"></output></div>
    <span class="clock" id="clock">22:14</span>
  </div>
</header>

<section class="stage" id="stage" aria-label="Salon">
  <div id="room"></div>
  <div id="season"></div>
  <div id="paper"></div>

{let left=9-3;for(const g of [...gRest].reverse()){if(left<=0)break;if(g.pax<=left&&g.pax<=2){g.arr='no';left-=g.pax}}}

{let have=G.filter(g=>g.arr==='in').reduce((s,g)=>s+g.pax,0);const cand=G.filter(g=>g.table&&g.arr==='wait'&&!g.keep);for(const g of cand){if(have>=312)break;if(have+g.pax<=312){g.arr='in';g.at=tri();have+=g.pax}}}

  else{const xs=[-40,-20,0,20,40];xs.forEach(x=>P.push([x,-25]));P.push([62,0]);[...xs].reverse().forEach(x=>P.push([x,25]));P.push([-62,0]);if(t.chairs<12)P.length=t.chairs}return P}

  return out}

function spark(){const B=new Array(12).fill(0);G.forEach(g=>{if(g.arr==='in'&&g.at!=null)B[Math.min(11,Math.floor(g.at/15))]+=g.inPax});
  const W=400,H=96,mx=Math.max(...B),bw=W/12;let s=`<svg class="spark" width="100%" viewBox="0 0 ${W} ${H+22}" role="img" aria-label="Varış ritmi">`;

  ['19:30','20:30','21:30'].forEach((t,i)=>s+=`<text x="${i*4*bw+3}" y="${H+17}">${t}</text>`);return s+`<line x1="0" x2="${W}" y1="${H+.5}" y2="${H+.5}" stroke="#3B434F"/></svg>`}

/* ═══ the line: parse what was typed ═════════════════════════════ */
const STEM=t=>t.length>4?t.replace(/(nin|nun|in|un|yi|yu|ye|ya|i|u|e|a|de|da|te|ta|den|dan)$/,''):t;
function findGuests(toks){if(!toks.length)return[];const res=[];G.forEach(g=>{const nt=fold(g.name).split(' ');let score=0,ok=true;
  for(const q of toks){const s=STEM(q);let best=0;for(const n of nt){if(n===q||n===s)best=Math.max(best,3);else if(n.startsWith(q))best=Math.max(best,2);else if(s.length>=3&&(n.startsWith(s)||q.startsWith(n)&&n.length>=3))best=Math.max(best,1)}if(!best){ok=false;break}score+=best}
  if(ok)res.push({g,score})});return res.sort((a,b)=>b.score-a.score||collator.compare(a.g.name,b.g.name)).map(r=>r.g)}
function nearestFree(pax,from,ex){return TABLES.filter(t=>t.cap-occ(t.id,ex)>=pax&&(!!ex?.vip||!t.id.startsWith('VIP'))).sort((a,b)=>Math.hypot(a.x-from.x,a.y-from.y)-Math.hypot(b.x-from.x,b.y-from.y)).slice(0,2)}
function parse(raw){const f=fold(raw).trim();const items=[];if(!f)return items;
  let toks=f.split(/[\s,.;:!?']+/).filter(Boolean);let table=null;
  toks=toks.filter((t,i)=>{let m=t.match(/^(vip|t)-?0*(\d{1,2})[a-z]*$/);if(m){const id=m[1]==='vip'?'VIP'+pad2(m[2]):'T'+pad2(m[2]);if(TBL(id)){table=id;return false}}if(t==='vip'&&/^\d/.test(toks[i+1]||'')){const id='VIP'+pad2(parseInt(toks[i+1]));if(TBL(id)){table=id;toks[i+1]='';return false}}return true}).filter(Boolean);
  const has=re=>toks.some(t=>re.test(t));
  const vSeat=has(/^(oturt|otur|tasi|koy|yerlestir|ata)/),vIn=has(/^(giris|geldi|iceri)/),vNo=has(/^gelmedi/),vWhere=has(/^(nerede|hangi|masasi)/);
  const STOP=/^(oturt\w*|otur\w*|tasi\w*|koy\w*|yerlestir\w*|ata|giris\w*|geldi\w*|gelmedi\w*|nerede|hangi|masa\w*|kim\w*|var|yap\w*|bul|goster|ve|ile|lutfen|bugun|ne|eksik|kaldi|hazir|mi|mu|durum\w*|rapor\w*|liste\w*|yazdir\w*|excel|yardim|git|ac)$/;
  const nameT=toks.filter(t=>!STOP.test(t));
  if(/eksik|ne kaldi|hazir mi|sorun/.test(f)){issues().forEach(i=>items.push({kind:'Açık konu',title:i.title,detail:i.detail,anchor:i.at,run:i.go}));if(!items.length)items.push({kind:'Cevap',title:'Açık konu yok.',detail:'Plan, oturma ve kurallar temiz.'});return items}
  if(/yardim/.test(f)){items.push({kind:'Yardım',title:'Yardım konularını aç',detail:'F10',run:()=>{clearQ();state.help=0;renderCol()}});}
  if(/yazdir|rapor|excel|liste/.test(f)){(/kapi/.test(f)?[REPS[2]]:REPS).forEach(r=>items.push({kind:'Rapor',title:`${r.name} · ${r.act}`,detail:r.desc,run:()=>{clearQ();state.selRep=r.id;setLens('rapor')}}));return items}
  const L=[['durum','durum'],['plan','plan'],['misafir','misafir'],['oturma','oturma'],['kapi','kapi'],['rapor','rapor'],['etkinlik','home']];
  if(has(/^(git|ac)$/)||toks.length===1){L.forEach(([w,l])=>{if(toks.some(t=>t.startsWith(w)))items.push({kind:'Git',title:`${{durum:'Durum',plan:'Plan',misafir:'Misafirler',oturma:'Oturma',kapi:'Kapı',rapor:'Raporlar',home:'Etkinlikler'}[l]} merceğine geç`,detail:'',run:()=>{clearQ();setLens(l)}})})}
  const gs=nameT.length?findGuests(nameT):[];
  if(vSeat&&table&&gs.length){const cands=gs.slice(0,4);const info=[];if(cands.length>1)info.push({kind:'Emin değilim',title:`“${nameT.join(' ')}” ${cands.length} kişiye uyuyor`,detail:'Hangisi? Aşağıdan seçin; hiçbir şey kendiliğinden yapılmaz.'});
    cands.forEach(g=>{const t=TBL(table);const free=t.cap-occ(table,g);
      if(g.table===table){items.push({kind:'Oturt',title:`${g.name} zaten ${loc(table)}`,detail:`${g.pax} kişi · değişiklik yok`,anchor:table})}
      else if(free>=g.pax){const w=ruleWarn(g,table);items.push({kind:'Oturt',title:`${g.name} → ${table}`,detail:`${g.pax} kişi · ${table}: ${occ(table)} → ${occ(table)+g.pax} / ${t.cap}`+(g.table?` · ${g.table} boşalır`:'')+(w?` · Uyarı: ${w}`:''),anchor:table,preview:{table,pax:g.pax,gid:g.id},run:()=>{clearQ();assign(g,table,true)}})}
      else{info.push({kind:'Sığmıyor',title:free?`${loc(table)} ${free} boş yer var; ${g.name} ${g.pax} kişi`:`${table} dolu (${occ(table)}/${t.cap}); ${g.name} ${g.pax} kişi`,detail:`Hiçbir şey yapılmadı. ${dat(table)} en yakın boş masalar aşağıda.`,anchor:table});
        nearestFree(g.pax,t,g).forEach((a,k)=>items.push({kind:k?'Öneri':'Öneri · en yakın',title:`${g.name} → ${a.id}`,detail:`${g.pax} kişi · ${a.id}: ${a.cap-occ(a.id)} boş yer`,anchor:a.id,preview:{table:a.id,pax:g.pax,gid:g.id},run:()=>{clearQ();assign(g,a.id,true)}}))}});
    return items.concat(info)}
  if(table&&!gs.length){const gt=G.filter(g=>g.table===table);items.push({kind:'Masa',title:`${table} · ${occ(table)} / ${TBL(table).cap}`,detail:gt.map(g=>g.name+(g.add?' +'+g.add:'')).join(' · ')||'Boş masa',anchor:table,run:()=>{clearQ();state.selTable=table;renderAll()}})}
  if(gs.length){gs.slice(0,8).forEach(g=>{
    if(state.lens==='kapi'||vIn){items.push({door:g})}
    else if(vNo)items.push({kind:'Gelmedi',title:`${g.name} gelmedi olarak işaretlensin mi?`,detail:`${g.pax} kişi · masa ${g.table||'yok'} planda kalır, canlı yer boşalır`,anchor:g.table,run:()=>{clearQ();markNo(g)}});
    else items.push({kind:'Misafir',title:g.name+(g.add?' +'+g.add:''),detail:`${g.pax} kişi · ${g.table?'masa '+g.table:'oturmamış'} · ${g.arr==='in'?'geldi '+hm(g.at):g.arr==='no'?'gelmedi':'bekleniyor'}`,anchor:g.table,vip:g.vip,run:()=>{clearQ();state.selGuest=g.id;setLens(g.table?'misafir':'oturma')}})})}
  if(!items.length)items.push({kind:'Anlamadım',title:`“${raw.trim()}” için bir şey bulamadım`,detail:'Örnek: “mehmet kaya t14e oturt”, “bugün ne eksik”, “t12 kimler”, “kapı listesi yazdır”.'});
  return items}
function ruleWarn(g,table){if(table.startsWith('VIP')&&!g.vip)return 'VIP masası, misafir VIP değil';if(g.apart){const o=G.find(x=>x.name===g.apart);if(o&&o.table===table)return `${g.apart} ile aynı masa`}return ''}
function colQuery(){const items=parse(state.q);state.items=items;if(state.hi>=items.length)state.hi=0;
  if(!state.hiSet){const k=items.findIndex(x=>x.run||x.door);state.hi=k<0?0:k}const it=items[state.hi];state.preview=it&&it.preview||null;state.anchor=it?(it.door?it.door.table:it.anchor)||null:null;
  let h=`<div class="qhead"><b>“${esc(state.q.trim())}”</b><span>↵ uygula · Esc</span></div><div class="scroll"><div class="results">`;
  [...items].map((x,i)=>[x,i]).reverse().forEach(([x,i])=>{const on=i===state.hi;
    if(x.door){h+=doorRow(x.door,on).replace('class="row door','data-item="'+i+'" class="row door');return}
    h+=`<div class="row prop${on?' on':''}" data-item="${i}" ${x.anchor?`data-anchor="${x.anchor}"`:''}><div><div class="kind">${esc(x.kind)}</div><div class="t1">${x.vip?vipMark(x.vip)+' ':''}${esc(x.title)}</div>${x.detail?`<div class="t2">${esc(x.detail)}</div>`:''}</div>${x.run?'<span class="kbd enter">↵</span>':''}</div>`});
  return h+'</div></div>'}

/* ═══ actions (each one changes only what it is about) ════════════ */
function checkIn(g,pax){if(g.arr==='in'&&!state.partial[g.id])return;const prev={arr:g.arr,at:g.at,inPax:g.inPax};g.arr='in';g.at=nowMin();g.inPax=pax??g.pax;delete state.partial[g.id];state.justIn[g.id]=1;
  afterDoor(g,true);pushUndo(`${g.name} · giriş ${nowHM()}`,()=>{Object.assign(g,prev);delete state.justIn[g.id];afterDoor(g)})}
function markNo(g){const prev={arr:g.arr,at:g.at,inPax:g.inPax};g.arr='no';g.inPax=0;state.justIn[g.id]=1;afterDoor(g);pushUndo(`${g.name} · gelmedi`,()=>{Object.assign(g,prev);delete state.justIn[g.id];afterDoor(g)})}
function afterDoor(g,lit){renderTally();const cell=$(`#col [data-state="${g.id}"]`);if(cell){const on=!!cell.closest('.row.on');cell.innerHTML=stateCell(g,on)}
  if($('#groups'))$$('#groups .grp').forEach((el,i)=>{const tmp=document.createElement('div');tmp.innerHTML=groupsHTML();const n=tmp.children[i];el.querySelector('.n').textContent=n.querySelector('.n').textContent;el.querySelector('.bar i').style.width=n.querySelector('.bar i').style.width});
  if(g.table&&state.lens==='kapi'){const before=G.filter(x=>x.table===g.table&&x.id<g.id).reduce((s,x)=>s+x.pax,0);redrawTable(g.table,lit?Array.from({length:g.pax},(_,i)=>before+i):null)}
  renderCaption()}
function assign(g,table,fromLine){const prev={table:g.table,draft:g.draft};const w=ruleWarn(g,table);g.table=table;g.draft=!!state.draft;state.justSeat=state.justSeat||{};state.justSeat[g.id]=table;state.warn=state.warn||{};if(w)state.warn[g.id]='Uyarı: '+w+' — yine de oturtuldu';else delete state.warn[g.id];
  state.selGuest=null;state.preview=null;state.selTable=table;
  pushUndo(`${g.name} → ${table}${g.draft?' (taslak)':''}`,()=>{g.table=prev.table;g.draft=prev.draft;delete state.warn?.[g.id];renderAll()});renderTally();renderAll()}
function unseat(g){g.table=null;g.draft=false;delete state.warn?.[g.id];renderTally();renderAll()}

  if(e.key==='F8'){e.preventDefault();q.focus();q.select();return}
  if(e.key==='F10'){e.preventDefault();clearQ();state.help=state.help===null?0:null;renderCol(false);return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!(e.target.matches('input,textarea')&&e.target.value)){e.preventDefault();undo();return}
  const typing=e.target.matches('input,textarea,select');
  if(e.altKey&&/^[0-6]$/.test(e.key)){e.preventDefault();clearQ();setLens(['home','durum','plan','misafir','oturma','kapi','rapor'][+e.key]);return}
  if(typing)return;
  if(/^[0-6]$/.test(e.key)){e.preventDefault();clearQ();setLens(['home','durum','plan','misafir','oturma','kapi','rapor'][+e.key]);return}
  if(e.key==='Escape'){state.help=null;state.selGuest=null;state.selTable=null;state.anchor=null;renderAll();return}
  if(state.lens==='home'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const all=[...EVENTS,...(state.extraEv||[])].sort((a,b)=>a.d.localeCompare(b.d));let i=all.findIndex(x=>x.id===state.selEvent);i=Math.max(0,Math.min(all.length-1,i+(e.key==='ArrowRight'?1:-1)));state.selEvent=all[i].id;renderAll();return}
  if(state.lens==='home'&&e.key==='Enter'){openEvent();return}
  if(state.lens==='plan'){if(e.key==='v'||e.key==='V'){state.tool='sec';renderCol()}if(e.key==='m'||e.key==='M'){state.tool='ekle';renderCol()}if((e.key==='r'||e.key==='R')&&state.selTable){rotate()}}
  if(e.key.length===1&&/\S/.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){q.focus()} // any letter goes to the line
});
function rotate(){const t=TBL(state.selTable);if(t.kind!=='rect')return;const p=t.rot;t.rot=(t.rot+15)%180;redrawTable(t.id);renderCol();pushUndo(`${t.id} döndürüldü ${t.rot}°`,()=>{t.rot=p;renderAll()})}
function openEvent(){const e=EVENTS.find(x=>x.id===state.selEvent);if(e&&e.live){setLens('durum')}else{const m=$('#evMsg');if(m)m.textContent='Bu prototipte yalnız Yılbaşı Galası açılır.'}}

// room interactions
const room=$('#room');
room.addEventListener('mouseover',e=>{const t=e.target.closest('[data-t]');if(t)renderCaption(t.dataset.t)});
room.addEventListener('mouseleave',()=>renderCaption());
let drag=null;
room.addEventListener('pointerdown',e=>{const tg=e.target.closest('[data-t]');const svg=room.querySelector('svg');if(!svg)return;
  if(state.lens==='plan'&&state.tool==='ekle'&&!tg){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());const id='T'+pad2(TABLES.filter(t=>t.id[0]==='T').length+1);TABLES.push({id,cap:10,chairs:10,kind:'round',x:Math.round(p.x),y:Math.round(p.y),rot:0});state.selTable=id;state.tool='sec';pushUndo(`${id} eklendi`,()=>{TABLES.splice(TABLES.findIndex(t=>t.id===id),1);state.selTable=null;renderAll()});renderAll();return}
  if(!tg)return;const id=tg.dataset.t,t=TBL(id);
  if(state.lens==='plan'){state.selTable=id;const ctm=svg.getScreenCTM();drag={t,sx:e.clientX,sy:e.clientY,ox:t.x,oy:t.y,k:ctm.a,moved:false};tg.setPointerCapture(e.pointerId);$$('#room .tb.sel').forEach(n=>n.classList.remove('sel'));tg.classList.add('sel');return}
  if(state.lens==='oturma'&&state.selGuest){const g=G.find(x=>x.id===state.selGuest);if(g&&!g.table){if(TBL(id).cap-occ(id)>=g.pax)assign(g,id);else renderCaption(id);return}}
  state.selTable=state.selTable===id?null:id;state.anchor=null;if(state.lens==='misafir'||state.lens==='kapi'){if(state.selTable){clearQ();state.q=id;q.value=id;renderCol(false);renderRoomSoft();return}}renderAll()});
room.addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.sx)/drag.k,dy=(e.clientY-drag.sy)/drag.k;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;drag.t.x=Math.round(drag.ox+dx);drag.t.y=Math.round(drag.oy+dy);const el=$(`#room [data-t="${drag.t.id}"]`);el.setAttribute('transform',`translate(${drag.t.x} ${drag.t.y}) rotate(${drag.t.rot})`)});
room.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(d.moved){pushUndo(`${d.t.id} taşındı`,()=>{d.t.x=d.ox;d.t.y=d.oy;renderAll()})}renderCol()});
room.addEventListener('dragover',e=>{if(e.target.closest('[data-t]'))e.preventDefault()});
room.addEventListener('drop',e=>{const tg=e.target.closest('[data-t]');const id=+e.dataTransfer.getData('text/plain');const g=G.find(x=>x.id===id);if(tg&&g){e.preventDefault();assign(g,tg.dataset.t)}});

// column interactions (delegated)
const col=$('#col');
col.addEventListener('dragstart',e=>{const r=e.target.closest('[data-seat]');if(r){e.dataTransfer.setData('text/plain',r.dataset.seat);state.selGuest=+r.dataset.seat;renderRoom()}});
col.addEventListener('mouseover',e=>{const r=e.target.closest('[data-anchor]');if(r&&!state.q){$$('#col .row.hov').forEach(x=>x.classList.remove('hov'));state.anchorHover=r.dataset.anchor;const svg=$('#leader');const keep=state.anchor;state.anchor=r.dataset.anchor;drawLeaderFor(r);state.anchor=keep}});
col.addEventListener('mouseleave',()=>drawLeader());
function drawLeaderFor(row){const id=row.dataset.anchor;const svg=$('#leader');const tgt=id==='ghost'?$('#room .ghost'):$(`#room [data-t="${id}"] .body`);if(!tgt||$('#room').style.display==='none'){svg.innerHTML='';return}
  const a=row.getBoundingClientRect(),b=tgt.getBoundingClientRect();const x1=a.left,y1=a.top+a.height/2,x2=b.right+4,y2=b.top+b.height/2;svg.innerHTML=`<path d="M${x1} ${y1} H${x1-26} L${x2+10} ${y2} H${x2}"/><circle cx="${x2}" cy="${y2}" r="3"/>`}
col.addEventListener('click',e=>{const T=e.target,c=s=>T.closest(s);let b;
  if(b=c('[data-go]')){issues()[+b.dataset.go].go();return}
  if(b=c('[data-issue]')){const i=issues()[+b.dataset.issue];state.anchor=i.at||null;state.selTable=i.at&&i.at!=='ghost'?i.at:null;renderAll();return}
  if(b=c('[data-tool]')){state.tool=b.dataset.tool;renderCol();return}
  if(c('#readPlan')){const f=document.createElement('input');f.type='file';f.accept='.pdf,image/*';f.click();return}
  if(c('#rot')){rotate();return}
  if(c('#toSeat')){setLens('oturma');return}
  if(b=c('[data-yes]')||c('[data-no]')){const s=SUG.find(x=>x.id===(b.dataset.yes||b.dataset.no));const yes=!!b.dataset.yes;s.state=yes?'yes':'no';
    if(yes&&s.id==='s2')TBL('VIP02').cap=11;if(yes&&s.id==='s3'){TABLES.push({id:'T39',cap:10,chairs:0,kind:'round',x:GHOST.x,y:GHOST.y,rot:0})}
    $(`[data-sugact="${s.id}"]`).innerHTML=sugAct(s);if(s.at!=='ghost')redrawTable(s.at);else renderRoom();renderRoomSoft();
    pushUndo(`${s.title.split(' — ')[0]} · ${yes?'kabul':'ret'}`,()=>reopen(s));return}
  if(b=c('[data-reopen]')){reopen(SUG.find(x=>x.id===b.dataset.reopen));return}
  if(b=c('[data-sug]')){state.selSug=b.dataset.sug;state.anchor=b.dataset.anchor;$$('#col [data-sug]').forEach(r=>r.classList.toggle('on',r===b));drawLeader();return}
  if(b=c('[data-f]')){state.filter=b.dataset.f;renderCol(false);return}
  if(c('#imp')){menu(c('#imp'),[{label:'Excel dosyası (.xlsx)…',fn:()=>{const f=document.createElement('input');f.type='file';f.accept='.xlsx,.xls,.csv';f.click()}},{label:'Liste yapıştır',fn:()=>{state.foot='paste';renderCol()}}]);return}
  if(c('#addG')){state.foot='add';renderCol();$('#nA')?.focus();return}
  if(c('#footX')){state.foot=null;renderCol();return}
  if(c('#pasteGo')){const lines=$('#pasteA').value.split('\n').map(s=>s.trim()).filter(Boolean);const added=lines.map(l=>{const m=l.match(/^(.*?)\s*\+\s*(\d+)$/);return add({name:m?m[1]:l,add:m?+m[2]:0,host:'—'})});state.foot=null;state.filter='all';state.selGuest=added[0].id;pushUndo(`${added.length} kayıt eklendi`,()=>{added.forEach(a=>G.splice(G.indexOf(a),1));renderAll()});renderAll();return}
  if(c('#addGo')){const n=$('#nA').value.trim();if(!n){$('#nA').focus();return}const g=add({name:n,add:+$('#nP').value||0});state.foot=null;state.selGuest=g.id;pushUndo(`${n} eklendi`,()=>{G.splice(G.indexOf(g),1);renderAll()});renderAll();return}
  if(b=c('[data-plan]')){const g=G.find(x=>x.id===+c('[data-planseg]').dataset.planseg);const p=g.plan;g.plan=b.dataset.plan;$$('[data-plan]').forEach(x=>x.classList.toggle('on',x===b));pushUndo(`${g.name} · plan ${g.plan.toLowerCase()}`,()=>{g.plan=p;renderCol()});return}
  if(c('#toSeat2')){setLens('oturma');return}
  if(b=c('[data-g]')){state.selGuest=+b.dataset.g;state.foot=null;state.anchor=b.dataset.anchor||null;$$('#col [data-g]').forEach(r=>r.classList.toggle('on',r===b));$('#col .foot').innerHTML=footMisafir();renderRoomSoft();drawLeader();return}
  if(b=c('[data-unseat]')){const g=G.find(x=>x.id===+b.dataset.unseat);delete state.justSeat[g.id];unseat(g);return}
  if(b=c('[data-draft]')){state.draft=b.dataset.draft==='1';renderCol();return}
  if(c('#draftSave')){const d=G.filter(g=>g.draft);d.forEach(g=>g.draft=false);pushUndo(`Taslak kaydedildi · ${d.length}`,()=>{d.forEach(g=>g.draft=true);renderAll()});renderTally();renderAll();return}
  if(c('#draftDrop')){G.filter(g=>g.draft).forEach(g=>{g.table=null;g.draft=false});renderTally();renderAll();return}
  if(b=c('[data-seat]')){const id=+b.dataset.seat;state.selGuest=state.selGuest===id?null:id;state.anchor=null;renderAll();return}
  if(b=c('[data-in]')){checkIn(G.find(x=>x.id===+b.dataset.in));return}
  if(b=c('[data-undoin]')){const g=G.find(x=>x.id===+b.dataset.undoin);const i=state.undo.map(u=>u.label).lastIndexOf(state.undo.find(u=>u.label.startsWith(g.name))?.label);const k=[...state.undo].reverse().findIndex(u=>u.label.startsWith(g.name+' ·'));if(k>-1){const u=state.undo.splice(state.undo.length-1-k,1)[0];u.fn();renderCaption()}return}
  if(b=c('[data-more]')){const g=G.find(x=>x.id===+b.dataset.more);menu(b,[{label:'Kısmi giriş…',fn:()=>{state.partial[g.id]=Math.max(1,g.pax-1);$(`[data-state="${g.id}"]`).innerHTML=stateCell(g)}},{label:'Masayı salonda göster',fn:()=>{state.selTable=g.table;renderRoomSoft()}},'-',{label:'Gelmedi olarak işaretle',danger:true,fn:()=>markNo(g)}]);return}
  if(b=c('[data-pm]')||c('[data-pp]')){const id=+(b.dataset.pm||b.dataset.pp),g=G.find(x=>x.id===id);state.partial[id]=Math.max(1,Math.min(g.pax,state.partial[id]+(b.dataset.pp?1:-1)));$(`[data-state="${id}"]`).innerHTML=stateCell(g);return}
  if(b=c('[data-pok]')){const id=+b.dataset.pok,g=G.find(x=>x.id===id);checkIn(g,state.partial[id]);return}
  if(b=c('[data-item]')){const i=+b.dataset.item;if(state.hi!==i){state.hi=i;state.hiSet=true;renderCol();renderRoomSoft();return}const it=state.items[i];if(it&&it.run)it.run();return}
  if(b=c('[data-rep]')){state.selRep=b.dataset.rep;state.repMsg='';renderAll();return}
  if(c('#repGo')){const r=REPS.find(x=>x.id===state.selRep);state.repMsg=`${r.name} hazırlandı (prototip: dosya üretilmez).`;$('#repMsg').textContent=state.repMsg;pushUndo(`${r.name} · ${r.act.toLowerCase()}`,()=>{});return}
  if(c('#openEv')){openEvent();return}
  if(b=c('[data-evact]')){const a=b.dataset.evact,m=$('#evMsg');
    if(a==='del'){$('#evActs').innerHTML=`<span class="warn">Bu etkinlik ve tüm kayıtları silinsin mi?</span><div style="display:flex;gap:10px;margin-top:6px"><button class="btn sm" style="border-color:var(--no);color:var(--no)" id="delYes">Sil</button><button class="txt" id="delNo">Vazgeç</button></div>`;return}
    m.textContent={same:'Yeni etkinlik bu salon yerleşimiyle, misafirsiz açılacak.',dup:'Kopya hazırlandı: misafirler ve masalar birlikte.',exp:'Paket hazırlandı: merit-yilbasi-gala.merit (prototip).'}[a];return}
  if(c('#delNo')){renderCol();return}
  if(c('#delYes')){$('#evMsg').textContent='Prototip: silme yapılmadı.';renderCol();return}
  if(c('#neX')){state.newEv=false;renderCol();return}
  if(c('#neGo')){const e={id:'n'+Date.now(),d:$('#neD').value||'2027-02-13',name:$('#neN').value||'Yeni etkinlik',venue:$('#neV').value,pax:0,tables:0,ready:'Boş — salon planı yok'};state.extraEv=[...(state.extraEv||[]),e];state.newEv=false;state.selEvent=e.id;renderAll();return}
  if(b=c('[data-help]')){const i=+b.dataset.help;state.help=state.help===i?null:i;if(state.help===null)state.help=i;renderCol();return}
});
function reopen(s){s.state='open';if(s.id==='s2')TBL('VIP02').cap=12;if(s.id==='s3'){const i=TABLES.findIndex(t=>t.id==='T39');if(i>-1)TABLES.splice(i,1)}renderAll()}
$('#stage').addEventListener('click',e=>{const b=e.target.closest('[data-ev]');if(b){state.selEvent=b.dataset.ev;state.newEv=false;renderAll();return}if(e.target.closest('#newEvBtn')){state.newEv=true;renderCol();$('#neN')?.focus();return}if(e.target.id==='undoBtn')undo()});
$('#stage').addEventListener('dblclick',e=>{if(e.target.closest('[data-ev]'))openEvent()});

/* ═══ boot ════════════════════════════════════════════════════════ */
renderTally();setLens('durum');
window.__merit={G,TABLES,counts,state,setLens,parse};
</script>
