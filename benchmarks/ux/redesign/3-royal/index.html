<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merit Royal — Etkinlik Defteri</title>
<style>
:root{
  --felt:#0F2B24; --felt-2:#0B231D; --felt-ink:#F3EDDF; --felt-mute:#B8C6BD;
  --em-800:#163A31; --em-700:#1E4B3F; --em-600:#2B5F50; --em-wash:#E2EBE4;
  --paper:#FAF6EC; --paper-2:#F3EDDF; --card:#FFFDF8; --tab:#E5DBC5; --tab-ink:#3E453F;
  --rule:#D6CBB4; --rule-2:#BDB097;
  --ink:#1A211E; --ink-2:#414943; --ink-3:#5A605B;
  --gold-ink:#755A22; --gold-line:#B59A5E; --gold-wash:#F2E8D0;
  --ox:#8A2C2A; --ox-wash:#F5E5E0; --ribbon:#74222E;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Charter,"Bitstream Charter",Georgia,serif;
  --sans:"Segoe UI","SF Pro Text",Inter,system-ui,-apple-system,sans-serif;
  --L:46%;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--felt);color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden;
  font-variant-numeric:lining-nums tabular-nums;display:grid;grid-template-rows:64px 1fr;min-width:1200px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--em-600);outline-offset:2px}
.felt :focus-visible,.topbar :focus-visible{outline-color:var(--felt-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- top: running title on the felt ---------- */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 140px 0 32px;color:var(--felt-ink)}
.rt-event{font:400 19px/1.2 var(--serif);letter-spacing:.01em}
.rt-event small{display:block;font:13px/1.4 var(--sans);color:var(--felt-mute);letter-spacing:.02em;margin-top:2px}
.crest{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--felt-ink)}
.crest svg{width:34px;height:42px;display:block}
.crest b{font:600 13px/1 var(--sans);letter-spacing:.42em;padding-left:.42em}
.crest span{display:block;font:italic 13px/1.3 var(--serif);color:var(--felt-mute);margin-top:4px;letter-spacing:.02em}
.rt-right{justify-self:end;text-align:right;font-size:14px;color:var(--felt-mute)}
.rt-right strong{color:var(--felt-ink);font-weight:600}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7FB89B;margin:0 6px 1px 0;vertical-align:middle}

/* ---------- the book ---------- */
.desk{position:relative;padding:4px 140px 34px 32px;min-height:0}
.book{position:relative;height:100%;display:grid;grid-template-columns:var(--L) 1fr;
  transition:grid-template-columns .42s var(--ease);background:var(--paper);border-radius:3px;
  box-shadow:0 1px 0 rgba(0,0,0,.25),0 22px 48px rgba(0,0,0,.32)}
.page{position:relative;overflow:auto;padding:30px 40px 30px;min-width:0;scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
.page.left{box-shadow:inset -18px 0 22px -20px rgba(70,52,20,.30)}
.page.right{box-shadow:inset 18px 0 22px -20px rgba(70,52,20,.30)}
.book.plate .page.left,.book.plate .page.right{display:none}
.page.full{display:none;grid-column:1/-1}
.book.plate .page.full{display:block}
.fold{position:absolute;top:0;bottom:0;left:var(--L);width:1px;background:rgba(70,52,20,.16);pointer-events:none;transition:left .42s var(--ease)}
.book:not(.plate) .fold{display:none}
.book.plate .fold{box-shadow:0 0 22px 6px rgba(70,52,20,.07)}
.page-in{animation:pin .28s var(--ease)}
@keyframes pin{from{opacity:0}to{opacity:1}}

/* thumb index on the fore-edge */
.thumbs{position:absolute;left:100%;top:26px;display:flex;flex-direction:column;gap:5px;width:118px}
.thumb{all:unset;cursor:pointer;display:block;padding:9px 12px 9px 14px;background:var(--tab);color:var(--tab-ink);
  border-radius:0 3px 3px 0;box-shadow:inset 6px 0 8px -6px rgba(70,52,20,.35);transition:background .2s,padding .2s}
.thumb b{display:block;font:600 14px/1.25 var(--sans);color:var(--ink)}
.thumb small{display:block;font:13px/1.3 var(--sans);color:var(--ink-3)}
.thumb:hover{background:#ECE3CF}
.thumb.on{background:var(--paper);box-shadow:none;padding-left:18px;margin-left:-4px}
.thumb.on b{color:var(--em-700)}
.thumb.cover{margin-bottom:14px}
.thumb:focus-visible{outline:2px solid var(--felt-ink);outline-offset:2px}
.thumb small.warn{color:var(--ox)}

/* the ribbon (concierge) */
.ribbon{position:absolute;top:100%;left:var(--L);transform:translateX(-50%);transition:left .42s var(--ease);
  display:flex;align-items:flex-start;gap:10px;background:none;border:0;padding:0;color:var(--felt-ink);z-index:5}
.ribbon i{display:block;width:22px;height:30px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.ribbon span{font:13px/30px var(--sans);letter-spacing:.04em;white-space:nowrap}
.ribbon span kbd{font:600 12px var(--sans);border:1px solid rgba(243,237,223,.45);border-radius:2px;padding:1px 5px;margin-left:6px}
.ribbon:hover span{text-decoration:underline;text-underline-offset:3px}

/* ---------- typography ---------- */
.eyebrow{font:600 12px/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;color:var(--ink)}
h1{font-size:34px;line-height:1.15;letter-spacing:-.005em}
h2{font-size:24px;line-height:1.2}
h3{font-size:19px;line-height:1.3}
.muted{color:var(--ink-2)}
.serif{font-family:var(--serif)}
.vip{font:600 12px/1 var(--sans);letter-spacing:.14em;color:var(--gold-ink);border-bottom:1px solid var(--gold-line);padding-bottom:2px}
.ornament{display:flex;align-items:center;gap:14px;color:var(--rule-2);margin:22px 0}
.ornament::before,.ornament::after{content:"";flex:1;height:1px;background:var(--rule)}
.ornament svg{width:10px;height:10px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px;margin-bottom:18px;
  border-bottom:1px solid var(--rule);position:relative}
.head::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--rule)}
.head .acts{display:flex;gap:10px;align-items:center;flex-shrink:0}

/* ---------- controls ---------- */
.btn{height:40px;padding:0 18px;border-radius:2px;border:1px solid var(--rule-2);background:transparent;color:var(--ink);font-weight:600;font-size:14px;
  transition:background .15s,border-color .15s}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--em-700);border-color:var(--em-700);color:#FBF7EE}
.btn.primary:hover{background:var(--em-800)}
.btn.big{height:56px;font-size:17px;padding:0 28px}
.btn.danger{color:var(--ox);border-color:#CDA59E}
.btn .caret{display:inline-block;margin-left:8px;width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-3px) rotate(45deg)}
.link{background:none;border:0;padding:0;color:var(--em-700);font-weight:600;font-size:14px;text-decoration:underline;text-decoration-color:rgba(30,75,63,.35);text-underline-offset:3px}
.link:hover{text-decoration-color:currentColor}
.link.ox{color:var(--ox);text-decoration-color:rgba(138,44,42,.35)}
.field{display:block;margin:0 0 16px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input{width:100%;height:42px;border:0;border-bottom:1px solid var(--rule-2);background:transparent;font:16px var(--sans);color:var(--ink);padding:0 2px}
.input:focus{outline:none;border-bottom:2px solid var(--em-700)}
textarea.input{height:auto;min-height:150px;border:1px solid var(--rule-2);padding:10px;line-height:1.6;resize:vertical;font-family:var(--sans)}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:2px}
.seg button{border:0;background:none;height:34px;padding:0 14px;font-size:14px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule-2)}
.seg button.on{background:var(--em-700);color:#FBF7EE;font-weight:600}
.filters{display:flex;gap:18px;font-size:14px;margin:10px 0 6px}
.filters button{background:none;border:0;padding:4px 0;color:var(--ink-2);border-bottom:2px solid transparent}
.filters button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--em-700)}
.search{position:relative}
.search svg{position:absolute;left:2px;top:12px;width:18px;height:18px;color:var(--ink-3)}
.search .input{padding-left:30px}

/* popover menu */
.menu{position:fixed;z-index:50;min-width:250px;background:var(--card);border:1px solid var(--rule-2);border-radius:2px;
  box-shadow:0 12px 30px rgba(15,43,36,.18);padding:6px 0;animation:pin .14s}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 16px;font-size:14px;color:var(--ink)}
.menu button:hover,.menu button:focus{background:var(--paper-2);outline:none}
.menu button.ox{color:var(--ox)}
.menu hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.menu small{display:block;color:var(--ink-3);font-size:13px}

/* ---------- ledgers ---------- */
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger th{font:600 12px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:0 8px 8px;border-bottom:1px solid var(--rule-2)}
.ledger td{padding:10px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
.ledger tr.row{cursor:pointer}
.ledger tr.row:hover td{background:rgba(229,219,197,.35)}
.ledger tr.sel td{background:var(--em-wash)}
.ledger .nm{font:16px/1.3 var(--serif);color:var(--ink)}
.ledger .pax{color:var(--ink-2);font-size:14px;margin-left:4px}
.tcode{font:600 14px var(--sans);letter-spacing:.02em}
.nil{color:var(--ox);font-weight:600}
.state{font-size:13px;font-weight:600}
.state.in{color:var(--em-700)}
.state.out{color:var(--ox)}
.state.wait{color:var(--ink-3);font-weight:400}
.fresh td{animation:fresh 1.6s ease-out}
@keyframes fresh{from{background:var(--gold-wash)}to{background:transparent}}

/* ---------- home ---------- */
.ev{display:grid;grid-template-columns:74px 1fr auto;gap:18px;align-items:center;padding:14px 10px;border-bottom:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.ev:hover{background:rgba(229,219,197,.35)}
.ev.sel{background:var(--em-wash)}
.ev .d{text-align:center;border-right:1px solid var(--rule);padding-right:14px}
.ev .d b{display:block;font:400 32px/1 var(--serif)}
.ev .d small{display:block;font:600 12px/1.6 var(--sans);letter-spacing:.14em;color:var(--ink-2)}
.ev .t{font:18px/1.3 var(--serif)}
.ev .v{font-size:14px;color:var(--ink-2)}
.ev .s{font-size:13px;font-weight:600;text-align:right;color:var(--ink-2)}
.ev.past .t{color:var(--ink-2)}
.sec-title{display:flex;align-items:center;gap:12px;margin:22px 0 4px}
.sec-title span{font:600 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.sec-title::after{content:"";flex:1;height:1px;background:var(--rule)}
.titlepage{max-width:560px;margin:0 auto;text-align:center;padding-top:28px}
.titlepage .mono svg{width:56px;height:68px;color:var(--em-700)}
.titlepage h1{font-size:42px;margin:14px 0 8px}
.facts{display:flex;justify-content:center;gap:0;margin:24px 0 8px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.facts div{flex:1;padding:14px 8px}
.facts div+div{border-left:1px solid var(--rule)}
.facts b{display:block;font:400 28px/1.1 var(--serif)}
.facts small{font-size:13px;color:var(--ink-2)}
.quiet-actions{display:flex;justify-content:center;gap:22px;margin-top:22px;flex-wrap:wrap}
.lock{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2);background:var(--paper-2);padding:8px 14px;border-radius:2px;margin-top:18px}
.lock svg{width:14px;height:14px}
.confirm{margin:26px auto 0;max-width:420px;border-top:1px solid var(--ox);padding-top:16px;color:var(--ox);font-size:15px}

/* ---------- overview ---------- */
.verdict{text-align:center;padding:26px 10px 0}
.verdict>svg{width:44px;height:54px;color:var(--em-700)}
.verdict .big{font:400 46px/1.1 var(--serif);margin:10px 0 10px}
.verdict p{max-width:440px;margin:0 auto;color:var(--ink-2);font-size:15px}
.twin{display:grid;grid-template-columns:1fr 1px 1fr;gap:0 30px;margin:34px 0 0;text-align:center}
.twin .bar{height:4px;background:var(--paper-2);margin:12px auto 10px;max-width:220px;position:relative;border-radius:2px;overflow:hidden}
.twin .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--em-600);transition:width .4s var(--ease)}
.twin .num{font:400 52px/1 var(--serif)}
.twin .num small{font:16px var(--sans);color:var(--ink-2);margin-left:4px}
.twin .sep{background:var(--rule)}
.issue{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:14px 4px;border-bottom:1px solid var(--rule);align-items:baseline;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.issue:hover{background:rgba(229,219,197,.35)}
.issue.sel{background:var(--em-wash)}
.issue .n{font:400 22px/1 var(--serif);color:var(--ox)}
.issue .tx{font-size:15px;color:var(--ink)}
.issue .tx small{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
.issue .go{font-size:13px;font-weight:600;color:var(--em-700);white-space:nowrap}
.check{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:9px 4px;font-size:15px;border-bottom:1px solid var(--rule)}
.check svg{width:16px;height:16px;margin-top:3px}

/* ---------- room / plate ---------- */
.room{position:relative;width:100%;height:100%}
.room svg{display:block;width:100%;height:100%}
.room .tb{cursor:pointer}
.room text{font-family:var(--sans);fill:var(--ink)}
.room .lbl{font-weight:600}
.room .cap{fill:var(--ink-2)}
.room .zone{fill:var(--paper-2);stroke:var(--rule-2)}
.room .zl{fill:var(--ink-3);letter-spacing:.2em;font-weight:600}
.room .tb.dim{opacity:.42}
.room .tb.drop circle.body,.room .tb.drop rect.body{fill:var(--em-wash);stroke:var(--em-700);stroke-width:2.5}
.plate-grid{display:grid;grid-template-columns:200px 1fr 220px;gap:26px;height:calc(100% - 210px);min-height:380px}
.margin{font-size:14px;color:var(--ink-2)}
.margin h3{font-size:17px;margin-bottom:8px}
.legend{list-style:none;padding:0;margin:0 0 22px}
.legend li{display:flex;align-items:center;gap:10px;padding:5px 0}
.legend svg{width:24px;height:24px;flex-shrink:0}
.note-card{background:var(--card);border:1px solid var(--rule);padding:16px 16px 14px;border-radius:2px}
.note-card .code{font:400 40px/1 var(--serif)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}
.kv b{font-weight:600;color:var(--ink)}
.step{display:inline-flex;align-items:center;border:1px solid var(--rule-2);border-radius:2px}
.step button{width:30px;height:28px;border:0;background:none;font-size:16px}
.step span{min-width:34px;text-align:center;font-weight:600}
.footnotes{margin-top:16px;border-top:1px solid var(--rule);padding-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 26px}
.fn{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;padding:6px 0;min-height:86px}
.fn .k{font:600 13px var(--sans);color:#fff;background:var(--em-700);width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px;margin-top:1px}
.fn.done .k{background:var(--rule-2)}
.fn .acts{margin-top:6px;display:flex;gap:16px}
.fn.done .tx{color:var(--ink-2)}

/* ---------- seating ---------- */
.grp{margin:0 0 16px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 6px;border-bottom:1px solid var(--rule-2)}
.grp-h b{font:400 17px var(--serif)}
.grp-h small{font-size:13px;color:var(--ink-2)}
.gu{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 8px;border-bottom:1px solid var(--rule);cursor:grab;
  transition:background .15s, opacity .25s, max-height .28s var(--ease), padding .28s var(--ease);max-height:80px;overflow:hidden}
.gu:hover{background:rgba(229,219,197,.35)}
.gu.sel{background:var(--em-wash);box-shadow:inset 3px 0 0 var(--em-700)}
.gu.gone{max-height:0;opacity:0;padding-top:0;padding-bottom:0;border-bottom-color:transparent}
.gu .nm{font:16px/1.3 var(--serif)}
.gu .sub{font-size:13px;color:var(--ink-2)}
.gu .sug{font-size:13px;color:var(--em-700);font-weight:600}
.rp-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.draft-band{background:var(--gold-wash);border-left:3px solid var(--gold-line);padding:8px 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lastline{position:sticky;bottom:-30px;background:var(--paper);border-top:1px solid var(--rule-2);padding:10px 0 12px;font-size:14px;color:var(--ink-2);margin-top:10px;min-height:44px}

/* ---------- door ---------- */
.book.door{background:var(--paper)}
body.night{background:var(--felt-2)}
.door-search .input{height:58px;font:22px var(--serif);padding-left:38px;border-bottom:2px solid var(--em-700)}
.door-search svg{top:19px;width:22px;height:22px}
.counters{display:flex;gap:26px;font-size:15px;color:var(--ink-2);margin:14px 0 8px;align-items:baseline}
.counters b{font:400 26px var(--serif);color:var(--ink);margin-right:5px;display:inline-block;min-width:2.2ch;text-align:right}
.counters .of{margin-left:auto;font-size:14px}
.drows{border-top:1px solid var(--rule-2)}
.drow{display:grid;grid-template-columns:1fr 70px 120px;gap:12px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--rule);cursor:pointer}
.drow:hover{background:rgba(229,219,197,.35)}
.drow.hi{background:var(--em-wash);box-shadow:inset 3px 0 0 var(--em-700)}
.drow .nm{font:17px/1.3 var(--serif)}
.drow .nm .pax{font:14px var(--sans);color:var(--ink-2);margin-left:4px}
.drow .tc{font:600 15px var(--sans);text-align:right}
.drow .st{text-align:right}
.hint{font-size:13px;color:var(--ink-3);margin:8px 0}
.groups{margin-top:18px}
.gline{display:grid;grid-template-columns:1fr 160px 64px;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.gline .bar{height:4px;background:var(--paper-2);position:relative;border-radius:2px;overflow:hidden}
.gline .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--em-600);transition:width .4s var(--ease)}
.gline .v{text-align:right;font-weight:600}
.placecard{max-width:470px;margin:6px auto 0;text-align:center}
.placecard .tbl{font:400 112px/1 var(--serif);letter-spacing:.01em;margin:6px 0 4px;color:var(--ink)}
.placecard .tbl.none{font-size:44px;color:var(--ox);padding:30px 0}
.placecard .who{font:30px/1.2 var(--serif)}
.placecard .meta{color:var(--ink-2);margin-top:6px;font-size:15px}
.placecard .minimap{height:150px;margin:16px 0 12px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 0}
.act-zone{min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.act-zone .done{font:22px var(--serif);color:var(--em-700)}
.act-zone .done.out{color:var(--ox)}
.secondary-acts{display:flex;justify-content:space-between;border-top:1px solid var(--rule);padding-top:12px;margin-top:4px}
.grp-note{font-size:14px;color:var(--ink-2);margin-top:12px}

/* ---------- reports ---------- */
.toc{list-style:none;margin:8px 0 0;padding:0}
.toc li{border-bottom:1px solid var(--rule)}
.toc button{display:flex;align-items:baseline;width:100%;background:none;border:0;padding:13px 6px 4px;text-align:left;gap:10px}
.toc button:hover{background:rgba(229,219,197,.35)}
.toc button.on{background:var(--em-wash)}
.toc .t{font:18px var(--serif)}
.toc .dots{flex:1;border-bottom:1.5px dotted var(--rule-2);transform:translateY(-4px)}
.toc .f{font:600 12px var(--sans);letter-spacing:.12em;color:var(--ink-2)}
.toc .d{display:block;font-size:14px;color:var(--ink-2);padding:0 6px 12px}

  if(S.gMode==='excel'){R.innerHTML=`<div style="max-width:500px;margin:0 auto;padding-top:10px"><div class="eyebrow">Excel’den al</div><h2 style="margin:6px 0 14px">misafirler-gala.xlsx</h2>

    ${[['A · Ad Soyad','Misafir'],['B · Ek Kişi','Yanındaki kişi'],['C · Statü','VIP / VVIP'],['D · Davet Eden','Davet eden'],['E · Masa','Masa']].map(r=>`<div class="kv"><span>${r[0]}</span><b>→ ${r[1]}</b></div>`).join('')}

  const g=gById(S.gSel); if(!g){R.innerHTML='';return;}

   <h1 style="margin:6px 0 4px">${esc(g.n)}</h1><div class="muted" style="font-size:16px">${g.pax>1?`${paxTxt(g)} · ${g.pax} kişi`:'Tek kişi'} ${g.st?` · <span class="vip">${g.st}</span>`:''}</div>
   <div style="margin-top:22px">
    <div class="kv"><span>Davet eden</span><b>${esc(HOSTS[g.h])||'—'}</b></div>

    <div class="kv" style="align-items:center"><span>Planlama</span><span class="seg" role="group" aria-label="Planlama durumu">${['Kesin','Belirsiz'].map(p=>`<button class="${g.pl===p?'on':''}" data-act="gPl" data-v="${p}" data-id="${g.id}">${p}</button>`).join('')}</span></div>
    <div class="kv"><span>Varış</span><span>${arTxt(g)} <span class="muted" style="font-size:13px">· kapıda değişir</span></span></div></div>
   <p class="muted" style="font-size:13px">Planlama ve varış ayrı şeylerdir: biri değişince öteki değişmez.</p>
   ${comp.length?`<div class="sec-title"><span>Raporda görünüşü</span></div><div style="font:13px/1.8 var(--sans);letter-spacing:.03em">${esc(g.n.toLocaleUpperCase('tr'))}<br>${comp.map(esc).join('<br>')}</div>`:''}
   <div style="margin-top:28px;display:flex;justify-content:space-between"><button class="link" data-act="noop">Kaydı düzenle</button><button class="link ox" data-act="noop">Kaydı sil</button></div></div>`;
}
function parsePaste(txt){return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{let st='';if(/\bVVIP\b/i.test(l))st='VVIP';else if(/\bVIP\b/i.test(l))st='VIP';
  const m=l.match(/\+\s*(\d+)/);const n=l.replace(/\+\s*\d+/,'').replace(/\bV?VIP\b/i,'').trim();return{n,pax:1+(m?+m[1]:0),st};});}
function addGuests(list){list.forEach(r=>{const g={id:G.length+1,n:r.n,pax:r.pax,st:r.st||'',h:r.h||'',t:null,pl:'Kesin',ar:'bekleniyor',tm:'',came:0};G.push(g);});}

/* ================= SEATING ================= */
function fitsFor(g){if(!g) return null; return new Set(T.filter(t=>free(t)>=g.pax).map(t=>t.id));}
function suggestFor(g){const c=T.filter(t=>free(t)>=g.pax&&(!!t.vip===!!g.st));return (c.sort((a,b)=>free(a)-free(b))[0]||T.filter(t=>free(t)>=g.pax)[0]||{}).id;}
function seatLeft(){
  const u=unseated(); const groups={};
  u.forEach(g=>{const k=g.h&&g.h!=='GM'?g.h:'_';(groups[k]=groups[k]||[]).push(g);});
  const order=['KS','LD','IM','_'].filter(k=>groups[k]);
  return `<div class="head"><div><div class="eyebrow">Oturma · masasızlar</div><h1>${u.length} misafir</h1><div class="muted" style="font-size:14px">${unseatedPax()} kişi · bir isme tıklayın, sonra masaya; ya da sürükleyin.</div></div></div>
   ${order.map(k=>{const list=groups[k],pax=list.reduce((s,g)=>s+g.pax,0);const gname=k==='_'?'Davetsiz / bireysel':HOSTS[k];
     return `<div class="grp"><div class="grp-h"><b>${esc(gname)}</b><small>${k==='KS'?'Junket · ':''}${list.length} misafir · ${pax} kişi ${k!=='_'?`· <button class="link" data-act="grpSeat" data-k="${k}" style="font-size:13px">Birlikte yerleştir</button>`:''}</small></div>
      ${list.map(g=>`<div class="gu ${S.seatSel===g.id?'sel':''}" draggable="true" data-act="seatSel" data-id="${g.id}" data-gu="${g.id}"><div><div class="nm">${esc(g.n)} <span class="muted" style="font:14px var(--sans)">${paxTxt(g)}</span> ${g.st?`<span class="vip">${g.st}</span>`:''}</div><div class="sub">${g.pax} kişi${g.pl==='Belirsiz'?' · belirsiz':''}</div></div>
      <div>${S.suggestOn?`<button class="link" data-act="applySug" data-id="${g.id}" style="font-size:13px">Oturt: ${suggestFor(g)}</button>`:''}</div></div>`).join('')}</div>`;}).join('')}
   ${u.length?'':'<p class="serif" style="font-size:20px">Herkesin masası var.</p>'}
   <div class="lastline" id="seatLast">${S.lastSeat?S.lastSeat:'Son işlem burada görünür; geri almak tek tıktır.'}</div>`;
}
function viewSeating(){
  $('#L').innerHTML=seatLeft(); bindSeatDnD();
  $('#R').innerHTML=`<div class="rp-head"><div><div class="eyebrow">Grand Balo Salonu</div><h2>${S.draft?'Taslak: VIP sırası değişikliği':'Yayındaki yerleşim'}</h2></div>
    <div class="acts" style="display:flex;gap:10px"><button class="btn" data-act="seatMore">Diğer<span class="caret"></span></button></div></div>
   ${S.draft?`<div class="draft-band"><span>Taslaktasınız. Kapı ekranı hâlâ yayındaki yerleşimi gösterir.</span><button class="btn primary" data-act="publishDraft" style="height:34px">Taslağı yayınla</button></div>`:''}

}
function mountSeatRoom(){const g=gById(S.seatSel);mountRoom($('#seatRoom'),{mode:'seat',fits:g&&!g.t?fitsFor(g):null});}
function renderSeatNotes(){
  const el=$('#seatNotes'); if(!el) return; const iss=ruleIssues().filter(x=>x.k!=='unseated');
  el.innerHTML=iss.length?iss.map((x,i)=>`<div class="fn" style="min-height:0"><span class="k" style="background:var(--ox)">${i+1}</span><div class="tx">${esc(x.n)} <span class="muted">${esc(x.d)}</span>${x.fix?`<div class="acts">${x.fix}</div>`:''}</div></div>`).join(''):'<p class="muted" style="font-size:14px">Kural uyarısı yok.</p>';
}
function assign(gid,tid,quiet){
  const g=gById(gid),t=tb(tid); if(!g||!t) return; const prev=g.t;
  g.t=tid; S.seatSel=null;
  const row=document.querySelector(`[data-gu="${gid}"]`); if(row) row.classList.add('gone');
  S.extraIssues=S.extraIssues.filter(x=>x.gid!==gid);
  if(g.st&&!t.vip){const vt=T.find(x=>x.vip&&free(x)>=g.pax);S.extraIssues.push({k:'vip',gid,n:`${g.n} ${g.st}; ${tid} VIP masası değil.`,d:'Kural: “VIP misafir VIP masada”. Uyarıdır.',go:'seating',tables:[tid],
    fix:vt?`<button class="link" data-act="moveTo" data-id="${gid}" data-t="${vt.id}">Taşı: ${vt.id}</button><button class="link" data-act="keepWarn" data-id="${gid}">Kalsın</button>`:''});}
  S.lastSeat=`<b class="serif" style="font-weight:400;font-size:16px;color:var(--ink)">${esc(g.n)}</b> → ${tid} · ${g.pax} kişi · <button class="link" data-act="unassign" data-id="${gid}" data-prev="${prev||''}">Geri al</button>`;
  if(S.view==='seating'){ $('#seatLast').innerHTML=S.lastSeat; mountSeatRoom(); renderSeatNotes();
    document.querySelectorAll('.gu.sel').forEach(x=>x.classList.remove('sel'));
    setTimeout(()=>{if(S.view==='seating'&&!quiet){$('#L').innerHTML=seatLeft();bindSeatDnD();}},320);}
  refreshThumbStatus();
}
function bindSeatDnD(){
  document.querySelectorAll('.gu').forEach(el=>{el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.gu);S.seatSel=+el.dataset.gu;
    document.querySelectorAll('.gu.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');mountSeatRoom();};});
  const room=$('#seatRoom'); if(!room) return;
  room.ondragover=e=>{const g=e.target.closest&&e.target.closest('.tb');if(g){e.preventDefault();room.querySelectorAll('.tb.drop').forEach(x=>x!==g&&x.classList.remove('drop'));g.classList.add('drop');}};
  room.ondrop=e=>{const g=e.target.closest&&e.target.closest('.tb');if(!g) return;e.preventDefault();assign(+e.dataTransfer.getData('text/plain'),g.dataset.t);};
}

/* ================= DOOR ================= */
function doorList(){const q=norm(S.doorQ.trim());
  return G.filter(g=>!q||norm(g.n).split(' ').some(w=>w.startsWith(q))||norm(g.n).startsWith(q)||norm(g.t||'')===q||norm(HOSTS[g.h]).startsWith(q)).sort((a,b)=>a.n.localeCompare(b.n,'tr'));}
const doorSt=g=>g.ar==='geldi'?`<span class="state in">✓ ${g.came<g.pax?g.came+'/'+g.pax:''} ${g.tm}</span>`:g.ar==='gelmedi'?'<span class="state out">Gelmedi</span>':'<span class="state wait">Bekleniyor</span>';
function drow(g){return `<div class="drow ${S.doorHi===g.id?'hi':''}" data-act="doorHi" data-id="${g.id}" data-drow="${g.id}"><div class="nm">${esc(g.n)}<span class="pax">${paxTxt(g)}</span> ${g.st?`<span class="vip">${g.st}</span>`:''}</div><div class="tc">${g.t||'<span class="nil" style="font-size:13px">yok</span>'}</div><div class="st">${doorSt(g)}</div></div>`;}
function grpArr(k){const gr=GROUPS.find(x=>x.k===k);return gr.base+G.filter(g=>g.h===k).reduce((s,g)=>s+(g._delta||0),0);}
function viewDoor(){
  const list=doorList(); if(S.doorHi==null||!list.find(g=>g.id===S.doorHi)) S.doorHi=list[0]&&list[0].id;
  $('#L').innerHTML=`<div class="search door-search"><svg><use href="#i-search"/></svg><input class="input" id="doorQ" placeholder="İsim, masa ya da davet eden…" value="${esc(S.doorQ)}" aria-label="Kapıda misafir ara" autocomplete="off"></div>
   <div class="counters" aria-live="polite"><span><b id="cA">${S.arrived}</b>geldi</span><span><b id="cW">${S.expected-S.arrived-S.noshow}</b>bekleniyor</span><span><b id="cN">${S.noshow}</b>gelmedi</span><span class="of muted">toplam ${S.expected} kişi</span></div>
   <div class="hint">Yazın · ↑ ↓ ile seçin · <b>Enter</b> giriş yapar. Gelmedi yalnızca sağdaki kartın altındadır.</div>
   <div class="drows" id="drows">${list.map(drow).join('')}</div>
   <div class="groups"><div class="sec-title"><span>Gruplara göre varış</span></div>${GROUPS.map(gr=>`<div class="gline" data-gl="${gr.k}"><span>${esc(gr.name)} <span class="muted">· ${gr.kind}</span></span><span class="bar"><i style="width:${grpArr(gr.k)/gr.total*100}%"></i></span><span class="v">${grpArr(gr.k)} / ${gr.total}</span></div>`).join('')}</div>`;
  const inp=$('#doorQ'); inp.oninput=e=>{S.doorQ=e.target.value;const l=doorList();S.doorHi=l[0]&&l[0].id;$('#drows').innerHTML=l.map(drow).join('');doorCard();};
  inp.onkeydown=e=>{const l=doorList(),i=l.findIndex(g=>g.id===S.doorHi);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=l[Math.max(0,Math.min(l.length-1,i+(e.key==='ArrowDown'?1:-1)))];if(n)setDoorHi(n.id);}
    if(e.key==='Enter'){e.preventDefault();const g=gById(S.doorHi);if(g&&g.ar==='bekleniyor')checkin(g.id,g.pax);}};
  doorCard(); setTimeout(()=>inp.focus(),60);
}
function setDoorHi(id){const old=document.querySelector('.drow.hi');if(old)old.classList.remove('hi');S.doorHi=id;const r=document.querySelector(`[data-drow="${id}"]`);if(r){r.classList.add('hi');r.scrollIntoView({block:'nearest'});}doorCard();}
function doorCard(partial){
  const R=$('#R'),g=gById(S.doorHi); if(!g){R.innerHTML='<p class="serif" style="font-size:22px;text-align:center;margin-top:120px">Bu isimde misafir yok.</p>';return;}
  const grp=GROUPS.find(x=>x.k===g.h);
  let act;
  if(partial) act=`<div class="muted">Kaç kişi geldi?</div><div style="display:flex;gap:14px;align-items:center"><span class="step"><button data-act="pStep" data-d="-1">−</button><span id="pN">${partial}</span><button data-act="pStep" data-d="1">+</button></span><span class="muted">/ ${g.pax}</span><button class="btn primary" data-act="pOk">Giriş yap</button><button class="link" data-act="pCancel">Vazgeç</button></div>`;
  else if(g.ar==='geldi') act=`<div class="done">✓ Giriş yapıldı · ${g.tm}</div><div class="muted">${g.came} / ${g.pax} kişi · <button class="link" data-act="undoDoor" data-id="${g.id}">Geri al</button></div>`;
  else if(g.ar==='gelmedi') act=`<div class="done out">Gelmedi olarak işaretli</div><div class="muted">Planlanan yeri korunur. <button class="link" data-act="undoDoor" data-id="${g.id}">Geri al</button></div>`;
  else act=`<button class="btn primary big" style="min-width:300px" data-act="checkin" data-id="${g.id}">Giriş · ${g.pax} kişi</button><div class="muted" style="font-size:13px">ya da Enter</div>`;
  R.innerHTML=`<div class="placecard"><div class="eyebrow">Masa</div><div class="tbl ${g.t?'':'none'}">${g.t||'Masası yok'}</div>
   <div class="who">${esc(g.n)}</div><div class="meta">${g.pax>1?`${paxTxt(g)} · ${g.pax} kişi`:'Tek kişi'}${g.st?` · <span class="vip">${g.st}</span>`:''}${g.h?` · Davet eden ${esc(HOSTS[g.h])}`:''}</div>
   <div class="room minimap" id="doorMap"></div>
   <div class="act-zone" id="actZone">${act}</div>
   ${!partial&&g.ar==='bekleniyor'?`<div class="secondary-acts"><button class="btn danger" style="height:34px" data-act="noshow" data-id="${g.id}">Gelmedi</button>${g.pax>1?`<button class="btn" style="height:34px" data-act="partial" data-id="${g.id}">Eksik geldi…</button>`:'<span></span>'}</div>`:'<div style="height:47px"></div>'}
   ${grp?`<div class="grp-note">${esc(grp.name)} grubu: <b id="gNote">${grpArr(grp.k)} / ${grp.total}</b> geldi</div>`:''}
   ${g.t?'':'<div class="grp-note" style="color:var(--ox)">Etkinlik ofisine haber verin; kapıdan masa verilmez.</div>'}</div>`;
  if(g.t) mountRoom($('#doorMap'),{mode:'mini',hl:[g.t]});
}
function updDoorCounters(){$('#cA')&&($('#cA').textContent=S.arrived,$('#cW').textContent=S.expected-S.arrived-S.noshow,$('#cN').textContent=S.noshow);
  GROUPS.forEach(gr=>{const el=document.querySelector(`[data-gl="${gr.k}"]`);if(el){el.querySelector('i').style.width=grpArr(gr.k)/gr.total*100+'%';el.querySelector('.v').textContent=`${grpArr(gr.k)} / ${gr.total}`;}});refreshThumbStatus();}
function updDoorRow(g){const r=document.querySelector(`[data-drow="${g.id}"]`);if(r)r.querySelector('.st').innerHTML=doorSt(g);}
function checkin(id,n){const g=gById(id);if(g.ar!=='bekleniyor')return;g.ar='geldi';g.came=n;g.tm=now();g._delta=(g._delta||0)+n;S.arrived+=n;updDoorRow(g);updDoorCounters();doorCard();}
function undoDoor(id){const g=gById(id);if(g.ar==='geldi'){S.arrived-=g.came;g._delta-=g.came;}if(g.ar==='gelmedi'){S.noshow-=g.pax;}g.ar='bekleniyor';g.came=0;g.tm='';updDoorRow(g);updDoorCounters();doorCard();}
function noshow(id){const g=gById(id);g.ar='gelmedi';S.noshow+=g.pax;updDoorRow(g);updDoorCounters();doorCard();}

  if(d.k==='door'){const by={};[...G].sort((a,b)=>a.n.split(' ').pop().localeCompare(b.n.split(' ').pop(),'tr')).slice(0,34).forEach(g=>{const L=g.n.split(' ').pop()[0].toLocaleUpperCase('tr');(by[L]=by[L]||[]).push(g);});
    body=`<h4>KAPI LİSTESİ · SOYADINA GÖRE</h4><div class="az">${Object.entries(by).map(([L,gs])=>`<h5>${L}</h5>${gs.map(g=>`<div><span>${U(g.n.split(' ').pop())}, ${esc(g.n.split(' ').slice(0,-1).join(' '))} ${g.pax>1?'('+g.pax+')':''}</span><b>${g.t||'—'}</b></div>`).join('')}`).join('')}</div>`;}
  if(d.k==='junket') body=`<h4>JUNKET VE GRUP RAPORU</h4><table class="xtab"><tr><th>Davet eden</th><th>Tür</th><th>Kişi</th><th>Geldi</th><th>Bekleniyor</th><th>Masalar</th></tr>${GROUPS.map(gr=>`<tr><td>${esc(gr.name)}</td><td>${gr.kind}</td><td>${gr.total}</td><td>${grpArr(gr.k)}</td><td>${gr.total-grpArr(gr.k)}</td><td>${[...new Set(G.filter(g=>g.h===gr.k&&g.t).map(g=>g.t))].sort().join(', ')}</td></tr>`).join('')}</table>`;
  if(d.k==='summary') body=`<h4>ETKİNLİK ÖZETİ</h4><div style="font:14px/1.7 var(--serif);max-width:520px;margin:0 auto"><p><b>Yılbaşı Galası</b>, 31 Aralık 2026, Merit Royal Hotel Grand Balo Salonu. 42 masa, ${S.expected} kişi bekleniyor.</p><p>Saat ${now()} itibarıyla ${S.arrived} kişi geldi, ${S.noshow} kişi gelmedi, ${S.expected-S.arrived-S.noshow} kişi bekleniyor. ${unseated().length} misafirin masası yok.</p><p>Junket: Kerem Sarıçiçek ${grpArr('KS')}/38 · Loyalty Desk ${grpArr('LD')}/24 · International Marketing ${grpArr('IM')}/16.</p></div>`;
  $('#R').innerHTML=`<div class="rp-head" style="margin-bottom:16px"><div><div class="eyebrow">Önizleme · ${d.f}</div><h2>${d.t}</h2></div><div style="display:flex;gap:12px;align-items:center"><span id="repMsg" class="inline-msg"></span><button class="btn primary" data-act="repGo">${d.btn}</button></div></div><div class="proof">${body}</div>`;

}

/* ================= CONCIERGE ================= */
function ccOpen(tab){S.cc=true;S.ccTab=tab||S.ccTab;$('#cc').classList.add('open');$('#cc').setAttribute('aria-hidden','false');ccRender();if(S.ccTab==='ask')setTimeout(()=>$('#ccIn').focus(),200);}
function ccClose(){S.cc=false;$('#cc').classList.remove('open');$('#cc').setAttribute('aria-hidden','true');}
function ccRender(){
  document.querySelectorAll('[data-act="ccTab"]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.ccTab));
  $('#ccInputWrap').style.display=S.ccTab==='ask'?'':'none';
  if(S.ccTab==='help'){$('#ccBody').innerHTML=HELP.map((h,i)=>`<button class="help-topic" data-act="helpT" data-i="${i}">${h[0]}<small>${h[1]}</small></button>`).join('');return;}
  $('#ccBody').innerHTML=S.ccLog.length?S.ccLog.map(e=>`<div class="entry"><div class="who">${e.you?'Siz':'Konsiyerj'} · ${e.tm}</div>${e.you?`<div class="you">“${esc(e.you)}”</div>`:`<div class="ans">${e.html}</div>`}</div>`).join(''):
   `<p class="serif" style="font-size:19px;margin:6px 0 4px">İyi akşamlar. Ne yapmamı istersiniz?</p><p class="muted" style="font-size:14px;margin:0">Türkçe yazın; harf hatası sorun değil. Bir şeyi değiştirmeden önce ne yapacağımı gösteririm, siz onaylarsınız.</p>`;
  const b=$('#ccBody'); b.scrollTop=b.scrollHeight;
}
const HELP=[['Misafiri masaya oturtmak','Oturma: isme tıklayın, sonra masaya. Ya da Konsiyerj’e yazın.'],['Kapıda giriş ve geri alma','Kapı: isim yazın, Enter. Geri al kartın üzerindedir.'],['Gelmedi ne yapar?','Varışı işaretler; planlanan yer korunur, salondaki boş yer açılır.'],['Planı PDF ya da görselden okumak','Salon planı · Diğer · Planı oku. Okunanlar dipnot olarak gelir.'],['Excel’den misafir almak','Misafirler · Diğer · Excel’den al. Önce eşleştirmeyi gösterir.'],['Kurallar: ayrı otursun, VIP masası','Oturma · Diğer · Kurallar. Kurallar uyarır, engellemez.'],['Raporları yazdırmak','Raporlar: belgeyi seçin, önizlemeye bakın, yazdırın.']];
function ccAsk(text){
  if(!text.trim()) return; S.ccLog.push({you:text,tm:now()});
  const q=norm(text); let html='';
  const tm=q.match(/\b(vip)\s?0?(\d)|\bt\s?(\d{1,2})/); const tid=tm?(tm[1]?'VIP0'+tm[2]:'T'+pad(tm[3])):null;
  const words=q.replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2);
  const cands=G.filter(g=>{const p=norm(g.n).split(' ');return p.some(x=>words.some(w=>w.startsWith(x.slice(0,Math.min(4,x.length)))&&x.length>=3));});
  const strong=cands.filter(g=>norm(g.n).split(' ').every(x=>words.some(w=>w.startsWith(x.slice(0,4)))));
  const who=strong.length===1?strong[0]:(cands.length===1?cands[0]:null);
  if(/eksik|ne kaldi|hazir mi|konu/.test(q)){const iss=ruleIssues();
    html=iss.length?`Bu gece ${iss.length} açık konu var:<ul>${iss.map(x=>`<li>${esc(x.n)}</li>`).join('')}</ul>${openSugs().length?`Ayrıca salon planında ${openSugs().length} öneri onay bekliyor.`:''} <button class="link" data-go="overview">Genel bakışta aç</button>`:'Açık konu yok.';}
  else if(/oturt|yerlestir|koy|tasi/.test(q)){
    if(!who&&cands.length>1) html=`Birden fazla misafir uyuyor; hangisi?<ul>${cands.slice(0,4).map(g=>`<li><button class="link" data-act="ccPick" data-id="${g.id}" data-t="${tid||''}">${esc(g.n)} ${paxTxt(g)}</button> — ${g.t||'masasız'}</li>`).join('')}</ul>`;
    else if(!who) html='Bu isimde bir misafir bulamadım. Adı ve soyadının başını yazmanız yeter.';
    else if(!tid) html=`${esc(who.n)} için hangi masa? Örn. “t13”.`;
    else html=proposeSeat(who,tid);}
  else if(/nerede|masasi|hangi masa/.test(q)&&who) html=`<b>${esc(who.n)}</b> ${paxTxt(who)} — ${who.t?`masa <b>${who.t}</b>`:'masası yok'}. Varış: ${who.ar}. <button class="link" data-act="ccShowSeat" data-id="${who.id}">Salonda göster</button>`;
  else if(/geldi|giris/.test(q)&&who) html=who.ar==='bekleniyor'?`<div class="fiche"><div class="what">${esc(who.n)} · ${who.pax} kişi giriş yapacak.</div><div class="why">Kapı sayacı ${S.arrived} → ${S.arrived+who.pax} olur.</div><div class="acts"><button class="btn primary" data-act="ccDoIn" data-id="${who.id}">Onayla</button><button class="btn" data-act="ccNo">Vazgeç</button></div></div>`:`${esc(who.n)} zaten “${who.ar}”. Değişiklik gerekmiyor.`;
  else html='Bunu anlayamadım. Şunları deneyebilirsiniz: “bugün ne eksik”, “selin akı t13e oturt”, “zeynep nerede”. Konular için F10.';
  S.ccLog.push({html,tm:now()}); ccRender();
}
function proposeSeat(g,tid){const t=tb(tid); if(!t) return `${tid} adında bir masa yok.`;
  if(g.t===tid) return `${esc(g.n)} zaten ${tid} masasında oturuyor. Değişiklik gerekmiyor.`;
  const f=free(t), after=fill(t)+g.pax, warn=[];
  if(f<g.pax) warn.push(`${tid} masasında ${f} boş yer var; ${g.pax} kişi gerekli. Masa ${after}/${t.cap} olur.`);
  if(g.st&&!t.vip) warn.push(`${g.n} ${g.st}; ${tid} VIP masası değil.`);
  return `<div class="fiche"><div class="what">${esc(g.n)} ${paxTxt(g)} → ${tid}</div><div class="why">${g.t?`Şu an ${g.t} masasında. `:'Şu an masasız. '}${tid}: ${fill(t)}/${t.cap} → ${after}/${t.cap}.</div>
   ${warn.length?`<div class="why" style="color:var(--ox)">${warn.map(esc).join(' ')}</div>`:''}
   <div class="acts"><button class="btn primary" data-act="ccDoSeat" data-id="${g.id}" data-t="${tid}">${warn.length?'Yine de oturt':'Onayla'}</button><button class="btn" data-act="ccNo">Vazgeç</button></div></div>`;}

    addTable(){const n=T.filter(t=>/^T\d+$/.test(t.id)).length+1;const id='T'+pad(n);T.push({id,x:600,y:520,shape:'round',r:26,cap:10,rot:0,base:0});selectPlanTable(id);flash('planMsg',`${id} pistin ortasına eklendi; sürükleyip yerleştirin.`);},
    cap(){const t=tb(S.planSel);t.cap=Math.max(1,t.cap+ +d.d);selectPlanTable(t.id);}, rot(){const t=tb(S.planSel);t.rot=(t.rot+ +d.d+360)%360;selectPlanTable(t.id);},
    rmTable(){T=T.filter(t=>t.id!==S.planSel);S.planSel=null;selectPlanTable(null);},
    seeSeat(){go('seating');},
    sugYes(){const s=S.sugs.find(x=>x.id===+d.id);s.state='yes';if(s.id===1&&!tb('T39'))T.push({id:'T39',x:1060,y:214,shape:'round',r:26,cap:10,rot:0,base:0});if(s.id===2)tb('T19').x=350;if(s.id===3)tb('VIP03').unread=false;planRefresh();},
    sugNo(){S.sugs.find(x=>x.id===+d.id).state='no';planRefresh();},
    sugUndo(){const s=S.sugs.find(x=>x.id===+d.id);if(s.state==='yes'){if(s.id===1)T=T.filter(t=>t.id!=='T39');if(s.id===2)tb('T19').x=336;if(s.id===3)tb('VIP03').unread=true;}s.state='open';planRefresh();},
    gSel(){S.gSel=+d.id;S.gMode='card';document.querySelectorAll('#gBody tr').forEach(x=>x.classList.toggle('sel',x.dataset.row===d.id));gRight();},
    gFilter(){S.gFilter=d.v;viewGuests();},
    gAdd(){S.gMode='add';document.querySelectorAll('#gBody tr.sel').forEach(x=>x.classList.remove('sel'));gRight();setTimeout(()=>$('#naName').focus(),50);},
    gMore(){openMenu(a,[{l:'Excel’den al',s:'Önce sütun eşleşmesini gösterir.',f:()=>{S.gMode='excel';gRight();}},{l:'Liste yapıştır',s:'“Ad Soyad +2” satırları.',f:()=>{S.gMode='paste';gRight();}},'-',{l:'Defteri Excel olarak indir'}]);},
    gCancel(){S.gMode='card';viewGuests();},
    gSave(){const n=$('#naName').value.trim();if(!n){$('#naName').focus();return;}addGuests([{n,pax:1+(+$('#naPax').value||0),st:$('#naSt').value,h:$('#naH').value}]);S.gSel=G.length;S.gMode='card';S.gFilter='all';S.gQ='';viewGuests();const r=document.querySelector(`[data-row="${S.gSel}"]`);if(r){r.classList.add('fresh');r.scrollIntoView({block:'center'});}refreshThumbStatus();},
    pasteSave(){const rows=parsePaste($('#pasteBox').value);addGuests(rows);S.gMode='card';S.gSel=G.length;viewGuests();refreshThumbStatus();},
    xlsDone(){S.gMode='card';viewGuests();},
    gPl(){const g=gById(d.id);g.pl=d.v;a.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v));const c=document.querySelector(`[data-row="${g.id}"] [data-pl]`);if(c)c.textContent=d.v;},
    seeSeatG(){go('seating');},
    noop(){},
    seatSel(){const id=+d.id;S.seatSel=S.seatSel===id?null:id;document.querySelectorAll('.gu').forEach(x=>x.classList.toggle('sel',+x.dataset.gu===S.seatSel));mountSeatRoom();},
    grpSeat(){const list=unseated().filter(g=>g.h===d.k),pax=list.reduce((s,g)=>s+g.pax,0);const t=T.filter(x=>free(x)>=pax).sort((a,b)=>free(a)-free(b))[0];
      ccOpen('ask');S.ccLog.push({you:`${HOSTS[d.k]} grubunu birlikte yerleştir`,tm:now()});
      S.ccLog.push({tm:now(),html:t?`<div class="fiche"><div class="what">${esc(HOSTS[d.k])} grubu → ${t.id}</div><div class="why">${list.map(g=>esc(g.n)+' '+paxTxt(g)).join(', ')} · ${pax} kişi. ${t.id}: ${fill(t)}/${t.cap} → ${fill(t)+pax}/${t.cap}. Tek masada yan yana oturur.</div><div class="acts"><button class="btn primary" data-act="ccGrp" data-k="${d.k}" data-t="${t.id}">Onayla</button><button class="btn" data-act="ccNo">Vazgeç</button></div></div>`:`Tek masada ${pax} boş yer yok. İki komşu masaya bölmemi ister misiniz?`});ccRender();},
    applySug(){const g=gById(d.id);assign(g.id,suggestFor(g));},
    unassign(){const g=gById(d.id);g.t=d.prev||null;S.extraIssues=S.extraIssues.filter(x=>x.gid!==g.id);S.lastSeat=`${esc(g.n)} geri alındı.`;viewSeating();refreshThumbStatus();},
    moveTo(){const g=gById(d.id);g.t=d.t;S.extraIssues=S.extraIssues.filter(x=>x.gid!==g.id);S.lastSeat=`${esc(g.n)} → ${d.t}`;viewSeating();},
    keepWarn(){S.extraIssues=S.extraIssues.filter(x=>x.gid!==+d.id);renderSeatNotes();refreshThumbStatus();},
    seatMore(){openMenu(a,[{l:'Yerleşim önerisi al',s:'Her masasıza bir masa önerir; siz uygularsınız.',f:()=>{S.suggestOn=!S.suggestOn;$('#L').innerHTML=seatLeft();bindSeatDnD();}},{l:S.draft?'Yayındaki yerleşime dön':'Taslakta çalış',s:'Taslak kapı ekranını etkilemez.',f:()=>{S.draft=!S.draft;viewSeating();}},'-',{l:'Kurallar',s:'Ayrı otursun · VIP masada · Junket birlikte',f:()=>{ccOpen('help');}}]);},
