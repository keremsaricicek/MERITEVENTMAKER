<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MERIT ENTERTAINMENT — EVENT MAKER</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main id="app" class="app"></main>
  <input id="floorPlanFile" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg,.pdf" hidden>
  <input id="guestFileInput" type="file" accept=".xlsx,.xls,.csv,text/csv" hidden>

  <!--
    The old #eventDialog was removed deliberately. Its submit handler called
    createDemoEvent(), which seeded 16 tables, 26 guests and a demo floor plan
    into what the user had asked to be a new event — a direct violation of
    "a blank event is actually blank". Event creation goes through the
    dedicated setup screen (startNewEvent / createBlankEventFromSetup).
  -->

  <!-- Every label is bound to its field with for/id. Without that binding a
       screen reader announces each of these as "edit, blank" -- the visible
       text is not enough. aria-labelledby names the dialog itself. -->
  <dialog id="guestDialog" class="dialog-sm" aria-labelledby="guestDialogTitle"><form id="guestForm" method="dialog">
    <input type="hidden" name="id"><div class="dialog-head"><h2 id="guestDialogTitle">Add Guest</h2><button class="dialog-close" value="cancel" aria-label="Close">×</button></div>
    <div class="dialog-body"><div class="form-grid"><div class="field full"><label for="gfName">Name Surname</label><input id="gfName" name="name" required placeholder="KEREM SARICICEK"></div><div class="field"><label for="gfAdditional">Additional Guests</label><input id="gfAdditional" name="additionalGuests" type="number" min="0" max="99" value="0" required></div><div class="field"><label for="gfPlanning">Planning Status</label><select id="gfPlanning" name="planningStatus"><option>Confirmed</option><option>Tentative</option></select></div><div class="field full"><div class="total-pax-box"><span id="gfPaxLabel">Total Pax</span><b id="guestTotalPax" role="status" aria-labelledby="gfPaxLabel">1</b></div></div><div class="field"><label for="gfVip">VIP Level</label><select id="gfVip" name="vip"><option>Standard</option><option>VIP</option><option>VVIP</option></select></div><div class="field"><label for="gfInvitedBy">Invited By</label><input id="gfInvitedBy" name="invitedBy"></div><div class="field full"><label for="gfNotes">Notes</label><textarea id="gfNotes" name="notes"></textarea></div></div></div>
    <div class="dialog-foot"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="default">Save Guest</button></div>
  </form></dialog>

  <!-- The wizard renders its own <h2 id="wizTitle"> from app-v8.js. -->
  <dialog id="excelDialog" class="dialog-wide" aria-labelledby="wizTitle"><div id="excelWizard"></div></dialog>
  <dialog id="guideDialog" class="guide-dialog"><div id="guideRoot" class="guide-shell"></div></dialog>
  <div id="toastWrap" class="toast-wrap" aria-live="polite"></div>

  <!--
    Spreadsheet (SheetJS xlsx@0.18.5) and PDF (pdfjs-dist@5.7.284) engines are
    loaded from jsDelivr, pinned to the exact versions this app was built
    against, instead of being vendored inline — see README.md for why, and
    for the script that builds a single-file, fully offline HTML for
    environments with no network access at runtime.
  -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/pdf.worker.min.mjs";
    globalThis.MeritPdf = { getDocument: pdfjsLib.getDocument, GlobalWorkerOptions: pdfjsLib.GlobalWorkerOptions };
    globalThis.dispatchEvent(new CustomEvent("merit-pdf-ready"));
  </script>
  <!--
    Tesseract.js (MIT) — real client-side OCR for the Plan Intelligence
    capacity auditor (reads printed pax notes / labels off the imported plan
    image). Loaded from CDN like the two engines above; requires network on
    first use to fetch its WASM core + language data. Not present in the
    offline single-file build — see src/plan-ocr.js for why.
  -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="src/app.js"></script>
  <script src="src/app-guests.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/plan-ocr.js"></script>
  <script src="src/plan-intelligence.js"></script>
  <script src="src/app-v8.js"></script>
</body>
</html>
